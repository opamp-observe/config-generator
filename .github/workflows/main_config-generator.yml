name: OpAMP configuration generator CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate detectors and configuration generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VALIDATION_IMAGE: opamp-config-generator-validation:test
    steps:
      - name: Check out configuration generator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build osquery validation image
        run: docker build --file containers/Dockerfile --tag "$VALIDATION_IMAGE" .

      - name: Validate detector schemas and SQL
        run: |
          docker run --rm \
            --entrypoint python3 \
            "$VALIDATION_IMAGE" \
            tests/validate_detectors.py \
            --osquery /usr/bin/osqueryi

  deployment-smoke-test:
    name: Test detector-to-configuration deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out configuration generator
        uses: actions/checkout@v4

      - name: Build and run the regression deployment
        run: bash ./tests/regression/run_regression_container.sh

      - name: Show deployment verification
        if: always()
        run: |
          if [[ -f build/regression-artifacts/regression-verification.json ]]; then
            cat build/regression-artifacts/regression-verification.json
          else
            echo "The deployment did not produce a verification report."
          fi
