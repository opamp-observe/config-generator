{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS database_process WHERE database_process.name LIKE 'ora_pmon_%' AND ((database_process.path LIKE '%19c%' OR database_process.path LIKE '%/19.%' OR database_process.path LIKE '%/19/%' OR database_process.cmdline LIKE '%19c%' OR database_process.cmdline LIKE '%/19.%' OR database_process.cmdline LIKE '%/19/%') OR EXISTS (SELECT 1 FROM process_envs AS version_environment WHERE version_environment.pid = database_process.pid AND (version_environment.value LIKE '%19c%' OR version_environment.value LIKE '%/19.%' OR version_environment.value LIKE '%/19/%'))) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT database_process.pid, substr(database_process.name, length('ora_pmon_') + 1) AS instance_name, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) AS oracle_home, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) AS oracle_base, database_process.path AS oracle_binary_path, database_process.cmdline FROM processes AS database_process WHERE database_process.name LIKE 'ora_pmon_%' AND ((database_process.path LIKE '%19c%' OR database_process.path LIKE '%/19.%' OR database_process.path LIKE '%/19/%' OR database_process.cmdline LIKE '%19c%' OR database_process.cmdline LIKE '%/19.%' OR database_process.cmdline LIKE '%/19/%') OR EXISTS (SELECT 1 FROM process_envs AS version_environment WHERE version_environment.pid = database_process.pid AND (version_environment.value LIKE '%19c%' OR version_environment.value LIKE '%/19.%' OR version_environment.value LIKE '%/19/%')));",
      "interval": 3600,
      "description": "Return Oracle database instances and installation roots."
    },
    "network_ports": {
      "query": "SELECT 'oracle_listener' AS component, listener_process.pid, listener_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS listener_process JOIN listening_ports AS listening_socket ON listening_socket.pid = listener_process.pid WHERE listener_process.name LIKE '%tnslsnr%' AND ((listener_process.path LIKE '%19c%' OR listener_process.path LIKE '%/19.%' OR listener_process.path LIKE '%/19/%' OR listener_process.cmdline LIKE '%19c%' OR listener_process.cmdline LIKE '%/19.%' OR listener_process.cmdline LIKE '%/19/%') OR EXISTS (SELECT 1 FROM process_envs AS listener_environment WHERE listener_environment.pid = listener_process.pid AND (listener_environment.value LIKE '%19c%' OR listener_environment.value LIKE '%/19.%' OR listener_environment.value LIKE '%/19/%'))) UNION ALL SELECT 'ords_separate_process' AS component, ords_process.pid, ords_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS ords_process JOIN listening_ports AS listening_socket ON listening_socket.pid = ords_process.pid WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')) OR EXISTS (SELECT 1 FROM process_open_files AS ords_file WHERE ords_file.pid = ords_process.pid AND lower(ords_file.path) LIKE '%ords.war'));",
      "interval": 3600,
      "description": "Return Oracle Net Listener and separately deployed ORDS sockets."
    },
    "configuration_files": {
      "query": "SELECT pid, instance_name, listener_config_candidate, tnsnames_config_candidate, sqlnet_config_candidate, spfile_candidate, pfile_candidate FROM (SELECT database_process.pid, substr(database_process.name, length('ora_pmon_') + 1) AS instance_name, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/listener.ora' AS listener_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/tnsnames.ora' AS tnsnames_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/sqlnet.ora' AS sqlnet_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/dbs/spfile' || substr(database_process.name, length('ora_pmon_') + 1) || '.ora' AS spfile_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/dbs/init' || substr(database_process.name, length('ora_pmon_') + 1) || '.ora' AS pfile_candidate, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/rdbms/*/' || substr(database_process.name, length('ora_pmon_') + 1) || '/trace/alert_' || substr(database_process.name, length('ora_pmon_') + 1) || '.log' AS text_alert_log_glob, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/rdbms/*/' || substr(database_process.name, length('ora_pmon_') + 1) || '/alert/log.xml' AS xml_alert_log_glob, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/tnslsnr/*/*/trace/listener.log' AS listener_log_glob FROM processes AS database_process WHERE database_process.name LIKE 'ora_pmon_%' AND ((database_process.path LIKE '%19c%' OR database_process.path LIKE '%/19.%' OR database_process.path LIKE '%/19/%' OR database_process.cmdline LIKE '%19c%' OR database_process.cmdline LIKE '%/19.%' OR database_process.cmdline LIKE '%/19/%') OR EXISTS (SELECT 1 FROM process_envs AS version_environment WHERE version_environment.pid = database_process.pid AND (version_environment.value LIKE '%19c%' OR version_environment.value LIKE '%/19.%' OR version_environment.value LIKE '%/19/%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product configuration-file locations."
    },
    "log_locations": {
      "query": "SELECT pid, instance_name, text_alert_log_glob, xml_alert_log_glob, listener_log_glob FROM (SELECT database_process.pid, substr(database_process.name, length('ora_pmon_') + 1) AS instance_name, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/listener.ora' AS listener_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/tnsnames.ora' AS tnsnames_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/network/admin/sqlnet.ora' AS sqlnet_config_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/dbs/spfile' || substr(database_process.name, length('ora_pmon_') + 1) || '.ora' AS spfile_candidate, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', '')) || '/dbs/init' || substr(database_process.name, length('ora_pmon_') + 1) || '.ora' AS pfile_candidate, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/rdbms/*/' || substr(database_process.name, length('ora_pmon_') + 1) || '/trace/alert_' || substr(database_process.name, length('ora_pmon_') + 1) || '.log' AS text_alert_log_glob, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/rdbms/*/' || substr(database_process.name, length('ora_pmon_') + 1) || '/alert/log.xml' AS xml_alert_log_glob, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = database_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = database_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(database_process.path, '/bin/oracle', ''))) || '/diag/tnslsnr/*/*/trace/listener.log' AS listener_log_glob FROM processes AS database_process WHERE database_process.name LIKE 'ora_pmon_%' AND ((database_process.path LIKE '%19c%' OR database_process.path LIKE '%/19.%' OR database_process.path LIKE '%/19/%' OR database_process.cmdline LIKE '%19c%' OR database_process.cmdline LIKE '%/19.%' OR database_process.cmdline LIKE '%/19/%') OR EXISTS (SELECT 1 FROM process_envs AS version_environment WHERE version_environment.pid = database_process.pid AND (version_environment.value LIKE '%19c%' OR version_environment.value LIKE '%/19.%' OR version_environment.value LIKE '%/19/%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product log-file and log-directory locations."
    },
    "asm_instances": {
      "query": "SELECT asm_process.pid, substr(asm_process.name, length('asm_pmon_') + 1) AS instance_name, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = asm_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(asm_process.path, '/bin/oracle', '')) AS grid_home, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = asm_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = asm_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(asm_process.path, '/bin/oracle', ''))) AS oracle_base, asm_process.path AS asm_binary_path, asm_process.cmdline, COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = asm_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(asm_process.path, '/bin/oracle', '')) || '/dbs/init' || substr(asm_process.name, length('asm_pmon_') + 1) || '.ora' AS asm_pfile_candidate, COALESCE((SELECT base_environment.value FROM process_envs AS base_environment WHERE base_environment.pid = asm_process.pid AND base_environment.key = 'ORACLE_BASE' LIMIT 1), COALESCE((SELECT home_environment.value FROM process_envs AS home_environment WHERE home_environment.pid = asm_process.pid AND home_environment.key = 'ORACLE_HOME' LIMIT 1), replace(asm_process.path, '/bin/oracle', ''))) || '/diag/asm/+asm/' || substr(asm_process.name, length('asm_pmon_') + 1) || '/trace/alert_' || substr(asm_process.name, length('asm_pmon_') + 1) || '.log' AS asm_alert_log_candidate FROM processes AS asm_process WHERE asm_process.name LIKE 'asm_pmon_+ASM%';",
      "interval": 3600,
      "description": "Return Oracle ASM instances, Grid homes, and candidate configuration and alert-log paths."
    },
    "deployment_features": {
      "query": "SELECT CASE WHEN EXISTS (SELECT 1 FROM processes AS cluster_process WHERE cluster_process.name IN ('crsd.bin', 'ocssd.bin', 'oraagent.bin', 'evmd.bin') OR upper(cluster_process.cmdline) LIKE '%SCAN%') THEN 'true' ELSE 'false' END AS rac_services_deployed, CASE WHEN EXISTS (SELECT 1 FROM processes AS asm_process WHERE asm_process.name LIKE 'asm_pmon_+ASM%') THEN 'true' ELSE 'false' END AS asm_deployed, CASE WHEN EXISTS (SELECT 1 FROM processes AS ords_process WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')) OR EXISTS (SELECT 1 FROM process_open_files AS ords_file WHERE ords_file.pid = ords_process.pid AND lower(ords_file.path) LIKE '%ords.war'))) THEN 'true' ELSE 'false' END AS ords_deployed_separately;",
      "interval": 3600,
      "description": "Report observed RAC, ASM, and separate ORDS process evidence."
    },
    "ords_details": {
      "query": "SELECT ords_process.pid, ords_process.path, ords_process.cmdline, COALESCE((SELECT ords_environment.value FROM process_envs AS ords_environment WHERE ords_environment.pid = ords_process.pid AND ords_environment.key = 'ORDS_CONFIG' LIMIT 1), ords_process.cwd) AS ords_config_location_candidate FROM processes AS ords_process WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')) OR EXISTS (SELECT 1 FROM process_open_files AS ords_file WHERE ords_file.pid = ords_process.pid AND lower(ords_file.path) LIKE '%ords.war'));",
      "interval": 3600,
      "description": "Return separate ORDS process and configuration-location evidence."
    }
  }
}

