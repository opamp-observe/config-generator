{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM services AS database_service WHERE database_service.name LIKE 'OracleService%' AND ((database_service.path LIKE '%26ai%' OR database_service.path LIKE '%23.26%' OR database_service.path LIKE '%\\\\26.%' OR database_service.path LIKE '%\\\\26\\\\%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%'))) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT database_service.pid, substr(database_service.name, length('OracleService') + 1) AS instance_name, database_service.name AS service_name, database_service.status, database_service.path AS service_command, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) AS oracle_home_candidate FROM services AS database_service WHERE database_service.name LIKE 'OracleService%' AND ((database_service.path LIKE '%26ai%' OR database_service.path LIKE '%23.26%' OR database_service.path LIKE '%\\\\26.%' OR database_service.path LIKE '%\\\\26\\\\%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%')));",
      "interval": 3600,
      "description": "Return Windows Oracle database services and installation evidence."
    },
    "network_ports": {
      "query": "SELECT 'oracle_listener' AS component, listener_service.name, listener_service.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM services AS listener_service JOIN listening_ports AS listening_socket ON listening_socket.pid = listener_service.pid WHERE listener_service.name LIKE 'Oracle%TNSListener%' UNION ALL SELECT 'ords_separate_process' AS component, ords_process.name, ords_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS ords_process JOIN listening_ports AS listening_socket ON listening_socket.pid = ords_process.pid WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')));",
      "interval": 3600,
      "description": "Return Windows Oracle listener and separate ORDS sockets."
    },
    "configuration_files": {
      "query": "SELECT pid, instance_name, listener_config_candidate, tnsnames_config_candidate, sqlnet_config_candidate, spfile_candidate, pfile_candidate FROM (SELECT database_service.pid, substr(database_service.name, length('OracleService') + 1) AS instance_name, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\listener.ora' AS listener_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\tnsnames.ora' AS tnsnames_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\sqlnet.ora' AS sqlnet_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\database\\spfile' || substr(database_service.name, length('OracleService') + 1) || '.ora' AS spfile_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\database\\init' || substr(database_service.name, length('OracleService') + 1) || '.ora' AS pfile_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\log\\diag\\rdbms\\*\\' || substr(database_service.name, length('OracleService') + 1) || '\\trace\\alert_' || substr(database_service.name, length('OracleService') + 1) || '.log' AS alert_log_glob FROM services AS database_service WHERE database_service.name LIKE 'OracleService%' AND ((database_service.path LIKE '%26ai%' OR database_service.path LIKE '%23.26%' OR database_service.path LIKE '%\\\\26.%' OR database_service.path LIKE '%\\\\26\\\\%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product configuration-file locations."
    },
    "log_locations": {
      "query": "SELECT pid, instance_name, alert_log_glob FROM (SELECT database_service.pid, substr(database_service.name, length('OracleService') + 1) AS instance_name, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\listener.ora' AS listener_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\tnsnames.ora' AS tnsnames_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\network\\admin\\sqlnet.ora' AS sqlnet_config_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\database\\spfile' || substr(database_service.name, length('OracleService') + 1) || '.ora' AS spfile_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\database\\init' || substr(database_service.name, length('OracleService') + 1) || '.ora' AS pfile_candidate, (SELECT installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%') LIMIT 1) || '\\log\\diag\\rdbms\\*\\' || substr(database_service.name, length('OracleService') + 1) || '\\trace\\alert_' || substr(database_service.name, length('OracleService') + 1) || '.log' AS alert_log_glob FROM services AS database_service WHERE database_service.name LIKE 'OracleService%' AND ((database_service.path LIKE '%26ai%' OR database_service.path LIKE '%23.26%' OR database_service.path LIKE '%\\\\26.%' OR database_service.path LIKE '%\\\\26\\\\%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%Oracle%Database%' AND (installed_program.version LIKE '%26ai%' OR installed_program.install_location LIKE '%26ai%' OR installed_program.version LIKE '%23.26%' OR installed_program.install_location LIKE '%23.26%' OR installed_program.version LIKE '%\\\\26.%' OR installed_program.install_location LIKE '%\\\\26.%' OR installed_program.version LIKE '%\\\\26\\\\%' OR installed_program.install_location LIKE '%\\\\26\\\\%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product log-file and log-directory locations."
    },
    "asm_instances": {
      "query": "SELECT asm_service.pid, substr(asm_service.name, length('OracleASMService') + 1) AS instance_name, asm_service.name AS service_name, asm_service.status, asm_service.path AS service_command, COALESCE((SELECT installed_program.install_location FROM programs AS installed_program WHERE lower(installed_program.name) LIKE '%oracle%grid%infrastructure%' OR lower(installed_program.name) LIKE '%oracle%automatic%storage%management%' ORDER BY length(installed_program.install_location) DESC LIMIT 1), asm_service.path) AS grid_home_candidate FROM services AS asm_service WHERE asm_service.name LIKE 'OracleASMService%';",
      "interval": 3600,
      "description": "Return Oracle ASM services and Grid Infrastructure installation evidence."
    },
    "deployment_features": {
      "query": "SELECT CASE WHEN EXISTS (SELECT 1 FROM services AS cluster_service WHERE cluster_service.name LIKE 'Oracle%Cluster%') THEN 'true' ELSE 'false' END AS rac_services_deployed, CASE WHEN EXISTS (SELECT 1 FROM services AS asm_service WHERE asm_service.name LIKE 'OracleASMService%') THEN 'true' ELSE 'false' END AS asm_deployed, CASE WHEN EXISTS (SELECT 1 FROM processes AS ords_process WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')))) THEN 'true' ELSE 'false' END AS ords_deployed_separately;",
      "interval": 3600,
      "description": "Report observed Windows RAC, ASM, and separate ORDS evidence."
    },
    "ords_details": {
      "query": "SELECT ords_process.pid, ords_process.path, ords_process.cmdline, ords_process.cwd AS ords_config_location_candidate FROM processes AS ords_process WHERE (lower(ords_process.name) = 'ords' OR ((lower(ords_process.name) = 'java' OR lower(ords_process.name) = 'java.exe') AND (lower(ords_process.cmdline) LIKE '%ords.war%' OR lower(ords_process.cmdline) LIKE '%oracle.dbtools%' OR lower(ords_process.cmdline) LIKE '% ords %')));",
      "interval": 3600,
      "description": "Return Windows ORDS process and working-directory evidence."
    }
  }
}

