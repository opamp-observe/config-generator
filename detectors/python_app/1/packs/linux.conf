{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time, app_process.uid, app_process.gid FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 300,
      "description": "Return Python interpreter and common Python application-server processes with runtime state."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, app_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.path AS unix_socket_path FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 300,
      "description": "Return TCP, UDP, and Unix sockets owned by Python application processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS configuration_candidate, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) AND (lower(open_file.path) LIKE '%.conf' OR lower(open_file.path) LIKE '%.ini' OR lower(open_file.path) LIKE '%.json' OR lower(open_file.path) LIKE '%.toml' OR lower(open_file.path) LIKE '%.yaml' OR lower(open_file.path) LIKE '%.yml') UNION SELECT app_process.pid, 'command_and_working_directory' AS source, app_process.cmdline || ' | candidates: ' || rtrim(app_process.cwd, '/') || '/pyproject.toml; logging.conf; logging.ini; gunicorn.conf.py; --config; --log-config' AS configuration_candidate, 'candidate_review_command_line' AS evidence_status FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 3600,
      "description": "Return observed open config files and candidates for Python logging, Gunicorn, Uvicorn, and project configuration."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS destination, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) AND (lower(open_file.path) LIKE '%.log' OR lower(open_file.path) LIKE '%/log/%' OR open_file.path IN ('/dev/stdout', '/dev/stderr')) UNION SELECT app_process.pid, 'configuration_evidence' AS source, environment.key || '=' || environment.value AS destination, 'environment_observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) AND environment.key IN ('OTEL_LOGS_EXPORTER', 'LOG_FILE', 'LOG_PATH') UNION SELECT app_process.pid, 'command_line' AS source, app_process.cmdline AS destination, 'review_--access-logfile_--error-logfile_--capture-output_--log-syslog_--log-config_and_stdio' AS evidence_status FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 300,
      "description": "Return open log files, safe logging environment settings, command-line logging options, and stdio/syslog evidence."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, 'environment' AS source, environment.key AS setting, environment.value AS value, 'observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) AND environment.key IN ('OTEL_METRICS_EXPORTER', 'OTEL_EXPORTER_OTLP_ENDPOINT', 'OTEL_EXPORTER_OTLP_METRICS_ENDPOINT', 'PROMETHEUS_MULTIPROC_DIR', 'STATSD_HOST', 'STATSD_PORT') UNION SELECT app_process.pid, 'listening_socket' AS source, 'application_endpoint' AS setting, listening_socket.address || ':' || CAST(listening_socket.port AS TEXT) AS value, 'candidate_metrics_path_requires_framework_configuration_or_probe' AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery')) UNION SELECT app_process.pid, 'command_line' AS source, 'gunicorn_statsd_or_instrumentation' AS setting, app_process.cmdline AS value, 'review_--statsd-host_--statsd-prefix_and_opentelemetry-instrument' AS evidence_status FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 300,
      "description": "Return OpenTelemetry, Prometheus, StatsD, Gunicorn, and listening-endpoint metrics evidence without inventing framework paths."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.state AS process_state, app_process.start_time, CASE WHEN app_process.parent IN (0, 1) THEN 'top_level_or_service_managed' ELSE 'child_or_worker' END AS process_role, 'running_process' AS state_source FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 300,
      "description": "Report Python application state and top-level versus worker relationship from live processes."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS executable_path, app_process.cwd, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'OTEL_SERVICE_NAME' LIMIT 1), '') AS otel_service_name, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'VIRTUAL_ENV' LIMIT 1), '') AS virtual_environment FROM processes AS app_process CROSS JOIN system_info AS host WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 3600,
      "description": "Return host, process, executable, working-directory, OpenTelemetry service, and virtual-environment identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.name, app_process.path, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'PYTHONHOME' LIMIT 1), '') AS python_home, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'VIRTUAL_ENV' LIMIT 1), '') AS virtual_environment, 'runtime_path_does_not_guarantee_patch_version' AS limitation FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn', 'uvicorn', 'hypercorn', 'celery'));",
      "interval": 3600,
      "description": "Return interpreter, Python home, and virtual-environment evidence without executing application binaries."
    }
  }
}
