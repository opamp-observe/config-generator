{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe')) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 300,
      "description": "Return Windows Python interpreter and common application-server processes with runtime state."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, app_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 300,
      "description": "Return listening sockets owned by Windows Python application processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, app_process.cmdline, rtrim(app_process.cwd, '\\/') || '/pyproject.toml' AS project_config_candidate, rtrim(app_process.cwd, '\\/') || '/logging.conf' AS logging_config_candidate, rtrim(app_process.cwd, '\\/') || '/gunicorn.conf.py' AS gunicorn_config_candidate, 'review_--config_--log-config_and_framework_settings' AS evidence_status FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 3600,
      "description": "Return project-relative candidates and command-line evidence for Python logging and server configuration."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, app_process.cmdline AS configuration_evidence, 'stdout; stderr; Windows service host; --access-logfile; --error-logfile; --log-syslog; --log-config; Python FileHandler/handlers' AS destinations_to_review, 'candidate_not_open_file_observed_on_windows' AS evidence_status FROM processes AS app_process WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 300,
      "description": "Return command evidence and every standard Python, Gunicorn, and Uvicorn logging destination class available to inspect on Windows."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, 'application_endpoint' AS mechanism, app_process.cmdline AS configuration_evidence, 'candidate_path_requires_framework_configuration_or_probe; review OpenTelemetry and StatsD settings' AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 300,
      "description": "Return candidate metrics listener bases and command evidence; Windows osquery cannot read another process environment."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.state AS process_state, app_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.status, 'not_registered_as_service') AS service_status, COALESCE(service.start_type, '') AS service_start_type FROM processes AS app_process LEFT JOIN services AS service ON service.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 300,
      "description": "Report Python process state and matching Windows service state when registered."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS executable_path, app_process.cwd, app_process.cmdline, COALESCE(service.name, '') AS service_name FROM processes AS app_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = app_process.pid WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 3600,
      "description": "Return host, process, executable, working-directory, and Windows service identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.name, app_process.path, app_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'installed_program_may_not_match_virtual_environment_runtime' AS limitation FROM processes AS app_process LEFT JOIN programs AS program ON lower(program.name) LIKE 'python%' WHERE ((lower(app_process.name) LIKE 'python%.exe' AND lower(app_process.cmdline) NOT LIKE '% -m pip%' AND lower(app_process.cmdline) NOT LIKE '%pytest%' AND lower(app_process.cmdline) NOT LIKE '%osquery%') OR lower(app_process.name) IN ('gunicorn.exe', 'uvicorn.exe', 'hypercorn.exe', 'celery.exe'));",
      "interval": 3600,
      "description": "Return interpreter-path and installed-program version evidence without executing Python."
    }
  }
}
