{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS server_process WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%'))) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, CASE WHEN instr(server_process.cmdline, '-Dweblogic.management.server=') > 0 THEN 'managed' ELSE 'administration' END AS server_role, CASE WHEN instr(server_process.cmdline, '-Dweblogic.management.server=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.management.server=') + length('-Dweblogic.management.server=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.management.server=') + length('-Dweblogic.management.server=')), ' ') - 1), '\"') ELSE '(self)' END AS administration_server_endpoint, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END AS domain_home, server_process.path AS java_path, server_process.cmdline FROM processes AS server_process WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%')));",
      "interval": 3600,
      "description": "Map WebLogic Administration and Managed Server JVMs."
    },
    "network_ports": {
      "query": "SELECT CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, CASE WHEN instr(server_process.cmdline, '-Dweblogic.management.server=') > 0 THEN 'managed' ELSE 'administration' END AS server_role, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.pid FROM processes AS server_process JOIN listening_ports AS listening_socket ON listening_socket.pid = server_process.pid WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%')));",
      "interval": 3600,
      "description": "Return listening sockets owned by each mapped WebLogic server."
    },
    "configuration_files": {
      "query": "SELECT pid, server_name, config_file_candidate FROM (SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\config\\config.xml' AS config_file_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\servers\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '\\logs' AS server_log_directory_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\servers\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '\\logs\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '.log' AS server_log_file_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\nodemanager\\nodemanager.log' AS node_manager_log_candidate FROM processes AS server_process WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product configuration-file locations."
    },
    "log_locations": {
      "query": "SELECT pid, server_name, server_log_directory_candidate, server_log_file_candidate, node_manager_log_candidate FROM (SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\config\\config.xml' AS config_file_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\servers\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '\\logs' AS server_log_directory_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\servers\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '\\logs\\' || CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END || '.log' AS server_log_file_candidate, CASE WHEN server_process.cwd LIKE '%\\bin' THEN substr(server_process.cwd, 1, length(server_process.cwd) - 4) ELSE server_process.cwd END || '\\nodemanager\\nodemanager.log' AS node_manager_log_candidate FROM processes AS server_process WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%')))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product log-file and log-directory locations."
    },
    "observability_urls": {
      "query": "SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, CASE WHEN instr(server_process.cmdline, '-Dweblogic.management.server=') > 0 THEN 'managed' ELSE 'administration' END AS server_role, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, 'http://' || CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) WHEN instr(listening_socket.address, ':') > 0 THEN '[' || listening_socket.address || ']' ELSE listening_socket.address END || ':' || CAST(listening_socket.port AS TEXT) || '/management/weblogic/latest/serverRuntime?fields=name,state,overallHealthState' AS health_url_candidate, 'http://' || CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) WHEN instr(listening_socket.address, ':') > 0 THEN '[' || listening_socket.address || ']' ELSE listening_socket.address END || ':' || CAST(listening_socket.port AS TEXT) || '/ready' AS readyapp_readiness_url_candidate, 'http://' || CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) WHEN instr(listening_socket.address, ':') > 0 THEN '[' || listening_socket.address || ']' ELSE listening_socket.address END || ':' || CAST(listening_socket.port AS TEXT) || '/weblogic/ready' AS operator_readiness_url_candidate, '' AS liveness_url_candidate, 'WebLogic Kubernetes Operator liveness uses Node Manager by default; no standard HTTP liveness URL is implied' AS liveness_note, 'http://' || CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) WHEN instr(listening_socket.address, ':') > 0 THEN '[' || listening_socket.address || ']' ELSE listening_socket.address END || ':' || CAST(listening_socket.port AS TEXT) || '/wls-exporter/metrics' AS prometheus_metrics_url_candidate, 'candidate_not_probed' AS endpoint_status, 'http_assumed_verify_tls_channel_and_deployment' AS scheme_note FROM processes AS server_process JOIN listening_ports AS listening_socket ON listening_socket.pid = server_process.pid WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%'))) AND listening_socket.protocol = 6;",
      "interval": 3600,
      "description": "Return candidate WebLogic health, readiness, operator-readiness, and Prometheus exporter URLs for each listening TCP socket."
    },
    "jvm_runtime": {
      "query": "SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, server_process.path AS java_executable, CASE WHEN lower(server_process.path) LIKE '%\\\\bin\\\\java.exe' THEN substr(server_process.path, 1, length(server_process.path) - length('\\\\bin\\\\java.exe')) ELSE '' END AS java_home, COALESCE((SELECT java_program.version FROM programs AS java_program WHERE (lower(java_program.name) LIKE '%jdk%' OR lower(java_program.name) LIKE '%java development kit%' OR lower(java_program.name) LIKE '%openjdk%' OR lower(java_program.name) LIKE '%temurin%' OR lower(java_program.name) LIKE '%corretto%' OR lower(java_program.name) LIKE '%zulu%') AND java_program.install_location <> '' AND instr(lower(server_process.path), lower(rtrim(java_program.install_location, '\\\\'))) = 1 ORDER BY length(java_program.install_location) DESC LIMIT 1), 'unknown') AS jvm_jdk_version, CASE WHEN (SELECT java_program.version FROM programs AS java_program WHERE (lower(java_program.name) LIKE '%jdk%' OR lower(java_program.name) LIKE '%java development kit%' OR lower(java_program.name) LIKE '%openjdk%' OR lower(java_program.name) LIKE '%temurin%' OR lower(java_program.name) LIKE '%corretto%' OR lower(java_program.name) LIKE '%zulu%') AND java_program.install_location <> '' AND instr(lower(server_process.path), lower(rtrim(java_program.install_location, '\\\\'))) = 1 ORDER BY length(java_program.install_location) DESC LIMIT 1) IS NOT NULL THEN 'installed_program_path_match' ELSE 'unavailable_from_osquery_metadata' END AS version_source, COALESCE((SELECT java_program.name FROM programs AS java_program WHERE (lower(java_program.name) LIKE '%jdk%' OR lower(java_program.name) LIKE '%java development kit%' OR lower(java_program.name) LIKE '%openjdk%' OR lower(java_program.name) LIKE '%temurin%' OR lower(java_program.name) LIKE '%corretto%' OR lower(java_program.name) LIKE '%zulu%') AND java_program.install_location <> '' AND instr(lower(server_process.path), lower(rtrim(java_program.install_location, '\\\\'))) = 1 ORDER BY length(java_program.install_location) DESC LIMIT 1), '') AS package_candidate, server_process.cmdline FROM processes AS server_process WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%')));",
      "interval": 3600,
      "description": "Return the Java executable, JAVA_HOME candidate, and JVM/JDK version evidence used by each WebLogic server."
    },
    "java_monitoring_endpoints": {
      "query": "SELECT endpoint.pid, endpoint.server_name, endpoint.address, endpoint.port, endpoint.protocol, endpoint.family, endpoint.monitoring_endpoint_type, CASE WHEN endpoint.monitoring_endpoint_type = 'jmx_rmi_registry' THEN 'service:jmx:rmi:///jndi/rmi://' || endpoint.endpoint_host || ':' || CAST(endpoint.port AS TEXT) || '/jmxrmi' WHEN endpoint.monitoring_endpoint_type = 'jmx_rmi_connector' THEN 'service:jmx:rmi://' || endpoint.endpoint_host || ':' || CAST(endpoint.port AS TEXT) WHEN endpoint.monitoring_endpoint_type = 'jdp_discovery' THEN 'jdp://' || endpoint.endpoint_host || ':' || CAST(endpoint.port AS TEXT) ELSE 'socket://' || endpoint.endpoint_host || ':' || CAST(endpoint.port AS TEXT) END AS monitoring_url, endpoint.jmx_authentication, endpoint.jmx_ssl, 'listening' AS endpoint_status FROM (SELECT server_process.pid, CASE WHEN instr(server_process.cmdline, '-Dweblogic.Name=') > 0 THEN trim(substr(substr(server_process.cmdline, instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), 1, instr(substr(server_process.cmdline || ' ', instr(server_process.cmdline, '-Dweblogic.Name=') + length('-Dweblogic.Name=')), ' ') - 1), '\"') ELSE 'AdminServer' END AS server_name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) WHEN instr(listening_socket.address, ':') > 0 THEN '[' || listening_socket.address || ']' ELSE listening_socket.address END AS endpoint_host, CASE WHEN server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.rmi.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_connector' WHEN server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_registry' WHEN server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jdp.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jdp_discovery' WHEN (lower(server_process.cmdline) LIKE '%jdwp%' AND (server_process.cmdline || ' ' LIKE '%address=' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%address=*:' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%address=0.0.0.0:' || CAST(listening_socket.port AS TEXT) || ' %')) THEN 'jdwp_debug' ELSE 'unknown' END AS monitoring_endpoint_type, CASE WHEN server_process.cmdline LIKE '%-Dcom.sun.management.jmxremote.authenticate=false%' THEN 'false' WHEN server_process.cmdline LIKE '%-Dcom.sun.management.jmxremote.authenticate=true%' THEN 'true' ELSE 'default_or_unspecified' END AS jmx_authentication, CASE WHEN server_process.cmdline LIKE '%-Dcom.sun.management.jmxremote.ssl=false%' THEN 'false' WHEN server_process.cmdline LIKE '%-Dcom.sun.management.jmxremote.ssl=true%' THEN 'true' ELSE 'default_or_unspecified' END AS jmx_ssl FROM processes AS server_process JOIN listening_ports AS listening_socket ON listening_socket.pid = server_process.pid WHERE server_process.name NOT LIKE 'osquery%' AND server_process.cmdline LIKE '%weblogic.Server%' AND ((server_process.cmdline LIKE '%12.2.1.4%' OR server_process.cmdline LIKE '%12214%' OR server_process.path LIKE '%12.2.1.4%' OR server_process.path LIKE '%12214%') OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%'))) AND (server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.rmi.port=' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.port=' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jdp.port=' || CAST(listening_socket.port AS TEXT) || ' %' OR (lower(server_process.cmdline) LIKE '%jdwp%' AND (server_process.cmdline || ' ' LIKE '%address=' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%address=*:' || CAST(listening_socket.port AS TEXT) || ' %' OR server_process.cmdline || ' ' LIKE '%address=0.0.0.0:' || CAST(listening_socket.port AS TEXT) || ' %')))) AS endpoint;",
      "interval": 3600,
      "description": "Return listening JMX, JDP, and JDWP endpoints explicitly configured on each WebLogic JVM."
    },
    "version_evidence": {
      "query": "SELECT installed_program.name, installed_program.version, installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%WebLogic%' AND (installed_program.version LIKE '%12.2.1.4%' OR installed_program.install_location LIKE '%12.2.1.4%' OR installed_program.version LIKE '%12214%' OR installed_program.install_location LIKE '%12214%');",
      "interval": 3600,
      "description": "Return the evidence used to distinguish the WebLogic release."
    }
  }
}

