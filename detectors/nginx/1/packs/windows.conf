{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS nginx_process WHERE lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT nginx_process.pid, nginx_process.parent, nginx_process.path, nginx_process.cmdline, nginx_process.cwd, nginx_process.state, nginx_process.start_time, CASE WHEN nginx_process.parent <> 0 THEN 'worker_or_child' ELSE 'master_or_single' END AS process_role FROM processes AS nginx_process WHERE lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe';",
      "interval": 300,
      "description": "Return every Windows NGINX process with state, start time, and parent relationship."
    },
    "network_ports": {
      "query": "SELECT nginx_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS nginx_process JOIN listening_ports AS listening_socket ON listening_socket.pid = nginx_process.pid WHERE lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe';",
      "interval": 300,
      "description": "Return listening sockets owned by Windows NGINX processes."
    },
    "configuration_files": {
      "query": "SELECT nginx_process.pid, nginx_process.cmdline, CASE WHEN instr(nginx_process.cmdline, '-c ') > 0 THEN trim(substr(substr(nginx_process.cmdline, instr(nginx_process.cmdline, '-c ') + 3), 1, instr(substr(nginx_process.cmdline || ' ', instr(nginx_process.cmdline, '-c ') + 3), ' ') - 1), '\"') ELSE '' END AS command_config_candidate, rtrim(nginx_process.cwd, '\\/') || '/conf/nginx.conf' AS prefix_config_candidate, 'candidate_not_content_parsed' AS evidence_status FROM processes AS nginx_process WHERE (lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe') AND nginx_process.parent = 0;",
      "interval": 3600,
      "description": "Return command-selected and prefix-relative Windows NGINX configuration candidates."
    },
    "log_locations": {
      "query": "SELECT nginx_process.pid, rtrim(nginx_process.cwd, '\\/') || '/logs/access.log' AS access_log_candidate, rtrim(nginx_process.cwd, '\\/') || '/logs/error.log' AS error_log_candidate, 'stderr_or_syslog_are_also_configurable' AS alternate_destination, 'candidate_verify_access_log_error_log_and_-e' AS evidence_status FROM processes AS nginx_process WHERE (lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe') AND nginx_process.parent = 0;",
      "interval": 300,
      "description": "Return prefix-relative log candidates and note configurable stderr or syslog destinations."
    },
    "metrics_outputs": {
      "query": "SELECT nginx_process.pid, listening_socket.address, listening_socket.port, 'http_or_https_unknown' AS scheme, '/configured-location' AS endpoint_path, 'stub_status_or_nginx_api' AS mechanism, 'candidate_requires_configuration_review_or_probe' AS evidence_status FROM processes AS nginx_process JOIN listening_ports AS listening_socket ON listening_socket.pid = nginx_process.pid WHERE (lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe') AND listening_socket.protocol = 6;",
      "interval": 300,
      "description": "Return candidate HTTP bases for status metrics without asserting an unobserved path or TLS scheme."
    },
    "service_state": {
      "query": "SELECT nginx_process.pid, nginx_process.state AS process_state, nginx_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.status, 'not_registered_as_service') AS service_status, COALESCE(service.start_type, '') AS service_start_type FROM processes AS nginx_process LEFT JOIN services AS service ON service.pid = nginx_process.pid WHERE lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe';",
      "interval": 300,
      "description": "Report NGINX process state and matching Windows service registration when present."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, nginx_process.pid AS process_id, nginx_process.start_time, nginx_process.path AS executable_path, nginx_process.cmdline, COALESCE(service.name, '') AS service_name FROM processes AS nginx_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = nginx_process.pid WHERE (lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe') AND nginx_process.parent = 0;",
      "interval": 3600,
      "description": "Return host, master-process, executable, and service identifiers for each Windows NGINX instance."
    },
    "version_evidence": {
      "query": "SELECT nginx_process.pid, nginx_process.path, nginx_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'installed_program_is_supporting_evidence_only' AS limitation FROM processes AS nginx_process LEFT JOIN programs AS program ON lower(program.name) LIKE '%nginx%' WHERE (lower(nginx_process.name) = 'nginx.exe' OR lower(nginx_process.path) LIKE '%\\nginx.exe') AND nginx_process.parent = 0;",
      "interval": 3600,
      "description": "Return runtime and installed-program version evidence for Windows NGINX."
    }
  }
}
