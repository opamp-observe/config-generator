{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS nginx_process WHERE lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT nginx_process.pid, nginx_process.parent, nginx_process.path, nginx_process.cmdline, nginx_process.cwd, nginx_process.state, nginx_process.start_time, nginx_process.uid, nginx_process.gid, CASE WHEN lower(nginx_process.cmdline) LIKE '%worker process%' THEN 'worker' ELSE 'master_or_single' END AS process_role FROM processes AS nginx_process WHERE lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx';",
      "interval": 300,
      "description": "Return every NGINX master and worker process with state, ownership, start time, and role evidence."
    },
    "network_ports": {
      "query": "SELECT nginx_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.path AS unix_socket_path FROM processes AS nginx_process JOIN listening_ports AS listening_socket ON listening_socket.pid = nginx_process.pid WHERE lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx';",
      "interval": 300,
      "description": "Return TCP, UDP, and Unix listening sockets owned by NGINX processes."
    },
    "configuration_files": {
      "query": "SELECT nginx_process.pid, nginx_process.cmdline, CASE WHEN instr(nginx_process.cmdline, '-c ') > 0 THEN trim(substr(substr(nginx_process.cmdline, instr(nginx_process.cmdline, '-c ') + 3), 1, instr(substr(nginx_process.cmdline || ' ', instr(nginx_process.cmdline, '-c ') + 3), ' ') - 1), '\"') ELSE '' END AS command_config_candidate, '/etc/nginx/nginx.conf' AS distribution_config_candidate, '/usr/local/nginx/conf/nginx.conf' AS source_build_config_candidate, CASE WHEN instr(nginx_process.cmdline, '-p ') > 0 THEN trim(substr(substr(nginx_process.cmdline, instr(nginx_process.cmdline, '-p ') + 3), 1, instr(substr(nginx_process.cmdline || ' ', instr(nginx_process.cmdline, '-p ') + 3), ' ') - 1), '\"') ELSE nginx_process.cwd END AS prefix_candidate, 'candidate_not_content_parsed' AS evidence_status FROM processes AS nginx_process WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND lower(nginx_process.cmdline) NOT LIKE '%worker process%';",
      "interval": 3600,
      "description": "Return command-selected and conventional NGINX configuration candidates plus the active path prefix."
    },
    "log_locations": {
      "query": "SELECT nginx_process.pid, 'open_file' AS source, open_file.path AS path_or_destination, 'observed_open' AS evidence_status FROM processes AS nginx_process JOIN process_open_files AS open_file ON open_file.pid = nginx_process.pid WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND (lower(open_file.path) LIKE '%.log' OR lower(open_file.path) LIKE '%/log/%' OR open_file.path IN ('/dev/stdout', '/dev/stderr')) UNION SELECT nginx_process.pid, 'documented_candidates' AS source, '/var/log/nginx/access.log; /var/log/nginx/error.log; prefix/logs/access.log; prefix/logs/error.log; stderr; syslog' AS path_or_destination, 'candidate_verify_access_log_error_log_and_-e' AS evidence_status FROM processes AS nginx_process WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND lower(nginx_process.cmdline) NOT LIKE '%worker process%';",
      "interval": 300,
      "description": "Return observed NGINX log descriptors and documented file, stderr, and syslog candidates."
    },
    "metrics_outputs": {
      "query": "SELECT nginx_process.pid, listening_socket.address, listening_socket.port, 'http_or_https_unknown' AS scheme, CASE WHEN listening_socket.address IN ('0.0.0.0', '::') THEN (SELECT hostname FROM system_info LIMIT 1) ELSE listening_socket.address END AS endpoint_host, '/configured-location' AS endpoint_path, 'stub_status_or_nginx_api' AS mechanism, 'candidate_requires_configuration_review_or_probe' AS evidence_status FROM processes AS nginx_process JOIN listening_ports AS listening_socket ON listening_socket.pid = nginx_process.pid WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND listening_socket.protocol = 6;",
      "interval": 300,
      "description": "Return candidate HTTP bases for stub_status or the NGINX API without asserting an unobserved location or TLS scheme."
    },
    "service_state": {
      "query": "SELECT nginx_process.pid, nginx_process.parent, nginx_process.state AS process_state, nginx_process.start_time, CASE WHEN lower(nginx_process.cmdline) LIKE '%worker process%' THEN 'worker' ELSE 'master_or_single' END AS service_role, 'running_process' AS state_source FROM processes AS nginx_process WHERE lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx';",
      "interval": 300,
      "description": "Report NGINX service state from live master and worker processes."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, nginx_process.pid AS process_id, nginx_process.start_time, nginx_process.path AS executable_path, nginx_process.cmdline, nginx_process.uid, nginx_process.gid FROM processes AS nginx_process CROSS JOIN system_info AS host WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND lower(nginx_process.cmdline) NOT LIKE '%worker process%';",
      "interval": 3600,
      "description": "Return the host UUID and master-process identity fields used to distinguish NGINX instances."
    },
    "version_evidence": {
      "query": "SELECT nginx_process.pid, nginx_process.path, nginx_process.cmdline, 'runtime_binary_no_execution' AS evidence_source, 'Run nginx -V out of band for an authoritative build version and configure arguments' AS limitation FROM processes AS nginx_process WHERE (lower(nginx_process.name) = 'nginx' OR lower(nginx_process.path) LIKE '%/nginx') AND lower(nginx_process.cmdline) NOT LIKE '%worker process%';",
      "interval": 3600,
      "description": "Return binary evidence while avoiding execution of nginx; exact build version requires an out-of-band nginx -V call."
    }
  }
}
