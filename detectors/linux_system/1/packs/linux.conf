{
  "_comment": "Copyright 2026 opamp.info; licensed under the Apache License, Version 2.0. See license.txt at the repository root.",
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM os_version WHERE platform != 'windows' LIMIT 1;"
  ],
  "queries": {
    "kernel_information": {
      "query": "SELECT version, arguments, path, device FROM kernel_info;",
      "interval": 3600,
      "description": "Return the active Linux kernel version, boot arguments, image path, and device identifier."
    },
    "network_interfaces": {
      "query": "SELECT details.interface, details.mac, details.type AS interface_type, details.mtu, details.metric, details.flags, details.ipackets, details.opackets, details.ibytes, details.obytes, details.ierrors, details.oerrors, details.idrops, details.odrops, details.collisions, details.last_change, details.link_speed, addresses.address, addresses.mask, addresses.broadcast, addresses.point_to_point, addresses.type AS address_type, CASE WHEN addresses.address IS NULL OR addresses.address = '' THEN 'unassigned' WHEN instr(addresses.address, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS address_family, CASE WHEN addresses.address = '127.0.0.1' OR addresses.address = '::1' THEN 'true' ELSE 'false' END AS is_loopback FROM interface_details AS details LEFT JOIN interface_addresses AS addresses ON addresses.interface = details.interface ORDER BY details.interface, addresses.address;",
      "interval": 3600,
      "description": "Return every observed Linux network interface, its counters and link properties, and all assigned IPv4 and IPv6 addresses."
    },
    "network_protocols": {
      "query": "SELECT DISTINCT observation.protocol_layer, observation.protocol, observation.evidence_source FROM (SELECT 'network' AS protocol_layer, CASE WHEN instr(address, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS protocol, 'interface_address' AS evidence_source FROM interface_addresses WHERE address != '' UNION ALL SELECT 'network' AS protocol_layer, CASE WHEN instr(destination, ':') > 0 OR instr(gateway, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS protocol, 'route' AS evidence_source FROM routes UNION ALL SELECT 'network' AS protocol_layer, CASE family WHEN 1 THEN 'unix' WHEN 2 THEN 'ipv4' WHEN 10 THEN 'ipv6' WHEN 16 THEN 'netlink' WHEN 17 THEN 'packet' ELSE 'family_' || CAST(family AS TEXT) END AS protocol, 'listening_socket' AS evidence_source FROM listening_ports UNION ALL SELECT 'transport' AS protocol_layer, CASE protocol WHEN 6 THEN 'tcp' WHEN 17 THEN 'udp' WHEN 0 THEN 'not_applicable' ELSE 'protocol_' || CAST(protocol AS TEXT) END AS protocol, 'listening_socket' AS evidence_source FROM listening_ports) AS observation ORDER BY observation.protocol_layer, observation.protocol, observation.evidence_source;",
      "interval": 3600,
      "description": "Return every network and transport protocol observed across interface addresses, routes, and listening sockets."
    },
    "network_routes": {
      "query": "SELECT destination, netmask, gateway, source, flags, interface, mtu, metric, type, hopcount, CASE WHEN instr(destination, ':') > 0 OR instr(gateway, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS address_family, CASE WHEN destination IN ('0.0.0.0', '::') AND netmask = 0 THEN 'true' ELSE 'false' END AS is_default_route FROM routes ORDER BY address_family, interface, metric, destination;",
      "interval": 3600,
      "description": "Return the complete active IPv4 and IPv6 route table visible in the current network namespace."
    },
    "listening_sockets": {
      "query": "SELECT socket.pid, process.name AS process_name, process.path AS process_path, socket.address, socket.port, socket.path AS socket_path, socket.net_namespace, CASE socket.family WHEN 1 THEN 'unix' WHEN 2 THEN 'ipv4' WHEN 10 THEN 'ipv6' WHEN 16 THEN 'netlink' WHEN 17 THEN 'packet' ELSE 'family_' || CAST(socket.family AS TEXT) END AS address_family, CASE socket.protocol WHEN 6 THEN 'tcp' WHEN 17 THEN 'udp' WHEN 0 THEN 'not_applicable' ELSE 'protocol_' || CAST(socket.protocol AS TEXT) END AS transport_protocol FROM listening_ports AS socket LEFT JOIN processes AS process ON process.pid = socket.pid ORDER BY address_family, transport_protocol, socket.address, socket.port, socket.path;",
      "interval": 300,
      "description": "Return all listening IPv4, IPv6, and Unix sockets with transport protocol, namespace, and owning process when visible."
    },
    "dns_resolvers": {
      "query": "SELECT id, type, address, netmask, options FROM dns_resolvers ORDER BY type, id;",
      "interval": 3600,
      "description": "Return every resolver, search domain, and resolver sort-list entry visible to Linux."
    },
    "kernel_log_access": {
      "query": "WITH execution_identity AS (SELECT process.euid, process.egid FROM osquery_info AS osquery_instance JOIN processes AS process ON process.pid = osquery_instance.pid), kernel_log_sources AS (SELECT 'kernel_device' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/dev/kmsg' UNION ALL SELECT 'kernel_device' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/proc/kmsg' UNION ALL SELECT 'log_store' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/var/log/kern.log' UNION ALL SELECT 'log_store' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/var/log/messages' UNION ALL SELECT 'log_store' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/run/log/journal' UNION ALL SELECT 'log_store' AS source_kind, path, uid, gid, mode, type FROM file WHERE path = '/var/log/journal'), assessed_sources AS (SELECT source.source_kind, source.path, source.type, source.mode, CASE WHEN identity.euid = 0 THEN 1 WHEN identity.euid = source.uid AND substr(source.mode, -3, 1) IN ('4', '5', '6', '7') THEN 1 WHEN (identity.egid = source.gid OR EXISTS (SELECT 1 FROM user_groups AS membership WHERE membership.uid = identity.euid AND membership.gid = source.gid)) AND substr(source.mode, -2, 1) IN ('4', '5', '6', '7') THEN 1 WHEN substr(source.mode, -1, 1) IN ('4', '5', '6', '7') THEN 1 ELSE 0 END AS mode_allows_read FROM kernel_log_sources AS source CROSS JOIN execution_identity AS identity) SELECT CAST(identity.euid AS TEXT) AS effective_user_id, CAST(identity.egid AS TEXT) AS effective_group_id, CAST(COUNT(assessed.path) AS TEXT) AS source_count, CAST(COALESCE(SUM(assessed.mode_allows_read), 0) AS TEXT) AS readable_source_count, COALESCE(group_concat(assessed.path, ','), '') AS source_paths, CASE WHEN COALESCE(SUM(CASE WHEN assessed.source_kind = 'log_store' AND assessed.mode_allows_read = 1 THEN 1 ELSE 0 END), 0) > 0 THEN 'true' WHEN COALESCE(SUM(CASE WHEN assessed.source_kind = 'kernel_device' AND assessed.mode_allows_read = 1 THEN 1 ELSE 0 END), 0) > 0 THEN 'unknown' ELSE 'false' END AS access_available, CASE WHEN COALESCE(SUM(CASE WHEN assessed.source_kind = 'kernel_device' AND assessed.mode_allows_read = 1 THEN 1 ELSE 0 END), 0) > 0 THEN 'true' ELSE 'false' END AS direct_device_probe_required, 'posix_mode_estimate' AS assessment_method FROM execution_identity AS identity LEFT JOIN assessed_sources AS assessed ON 1 = 1;",
      "interval": 3600,
      "description": "Estimate whether the osquery identity can read any direct kernel device, kernel log file, or system journal directory using visible POSIX mode ownership."
    },
    "syslog_availability": {
      "query": "SELECT 'systemd-journald' AS provider, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'systemd-journald') THEN 'true' ELSE 'false' END AS service_running, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/run/systemd/journal/dev-log') OR EXISTS (SELECT 1 FROM file WHERE path = '/dev/log') THEN 'true' ELSE 'false' END AS local_endpoint_present, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/run/log/journal') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/journal') THEN 'true' ELSE 'false' END AS log_storage_present, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'systemd-journald') OR EXISTS (SELECT 1 FROM file WHERE path = '/run/systemd/journal/dev-log') OR EXISTS (SELECT 1 FROM file WHERE path = '/run/log/journal') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/journal') THEN 'true' ELSE 'false' END AS available UNION ALL SELECT 'rsyslog', CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'rsyslogd') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/dev/log') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/var/log/syslog') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/messages') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'rsyslogd') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/syslog') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/messages') THEN 'true' ELSE 'false' END UNION ALL SELECT 'syslog-ng', CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'syslog-ng') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/dev/log') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/var/log/syslog') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/messages') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'syslog-ng') THEN 'true' ELSE 'false' END UNION ALL SELECT 'syslogd', CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'syslogd') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/dev/log') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/var/log/syslog') OR EXISTS (SELECT 1 FROM file WHERE path = '/var/log/messages') THEN 'true' ELSE 'false' END, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE name = 'syslogd') THEN 'true' ELSE 'false' END ORDER BY provider;",
      "interval": 300,
      "description": "Report whether journald, rsyslog, syslog-ng, or traditional syslogd is running or has a visible local endpoint or log store."
    }
  }
}
