{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM system_info LIMIT 1;"
  ],
  "queries": {
    "host_identity": {
      "query": "SELECT system.hostname, system.computer_name, system.local_hostname, system.uuid AS host_uuid, operating_system.name AS operating_system, operating_system.version AS os_version, operating_system.major AS os_major, operating_system.minor AS os_minor, operating_system.patch AS os_patch, operating_system.build AS os_build, operating_system.platform, operating_system.platform_like, operating_system.codename, operating_system.arch, operating_system.install_date AS os_install_date, system.hardware_vendor, system.hardware_model, osquery.version AS osquery_version FROM system_info AS system CROSS JOIN os_version AS operating_system CROSS JOIN osquery_info AS osquery;",
      "interval": 3600,
      "description": "Return hostname, host UUID, operating system, OS version, architecture, hardware identity, and osquery version."
    },
    "network_ips": {
      "query": "SELECT interface, friendly_name, address, mask, broadcast, point_to_point, type, CASE WHEN instr(address, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS address_family, CASE WHEN address = '127.0.0.1' OR address = '::1' THEN 'true' ELSE 'false' END AS is_loopback FROM interface_addresses ORDER BY interface, address;",
      "interval": 3600,
      "description": "Return every IPv4 and IPv6 interface address, including loopback and link-local addresses."
    },
    "deployment_environment": {
      "query": "SELECT CASE WHEN evidence.container_evidence = 1 THEN 'possible_container' WHEN evidence.virtual_machine_evidence = 1 THEN 'possible_virtual_machine' ELSE 'physical_or_unknown' END AS environment_type, CASE WHEN evidence.container_evidence = 1 THEN 'Windows container registry marker' WHEN evidence.virtual_machine_evidence = 1 THEN 'virtualization-related hardware vendor or model' ELSE 'no container or virtual-machine evidence observed' END AS evidence, evidence.hardware_vendor, evidence.hardware_model, evidence.board_vendor, 'heuristic' AS classification_method FROM (SELECT system.hardware_vendor, system.hardware_model, system.board_vendor, CASE WHEN EXISTS (SELECT 1 FROM registry AS container_registry WHERE container_registry.path LIKE 'HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Container%') THEN 1 ELSE 0 END AS container_evidence, CASE WHEN lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%vmware%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%virtualbox%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%qemu%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%kvm%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%xen%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%virtual machine%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%amazon ec2%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%google compute engine%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%openstack%' THEN 1 ELSE 0 END AS virtual_machine_evidence FROM system_info AS system) AS evidence;",
      "interval": 3600,
      "description": "Classify the observed environment as a possible container, possible virtual machine, or physical/unknown and return the evidence."
    },
    "execution_identity": {
      "query": "SELECT DISTINCT session.user AS username, session.sid, session.type AS session_type, session.tty, session.host AS remote_host, CASE WHEN EXISTS (SELECT 1 FROM users AS user_record JOIN user_groups AS membership ON membership.uid = user_record.uid JOIN groups AS group_record ON group_record.gid = membership.gid WHERE lower(user_record.username) = lower(session.user) AND lower(group_record.groupname) = 'administrators') THEN 'administrator' ELSE 'standard_or_unknown' END AS privilege_role, 'active_logged_in_session' AS identity_source, 'false' AS execution_identity_confirmed FROM logged_in_users AS session WHERE session.user <> '';",
      "interval": 3600,
      "description": "Return active Windows session users and inferred privilege roles; osquery does not expose its Windows process-token username."
    },
    "user_roles": {
      "query": "SELECT DISTINCT session.user AS username, group_record.groupname AS role FROM logged_in_users AS session JOIN users AS user_record ON lower(user_record.username) = lower(session.user) JOIN user_groups AS membership ON membership.uid = user_record.uid JOIN groups AS group_record ON group_record.gid = membership.gid WHERE session.user <> '' ORDER BY session.user, group_record.groupname;",
      "interval": 3600,
      "description": "Return local group roles associated with active Windows session users."
    }
  }
}

