{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM system_info LIMIT 1;"
  ],
  "queries": {
    "host_identity": {
      "query": "SELECT system.hostname, system.computer_name, system.local_hostname, system.uuid AS host_uuid, operating_system.name AS operating_system, operating_system.version AS os_version, operating_system.major AS os_major, operating_system.minor AS os_minor, operating_system.patch AS os_patch, operating_system.build AS os_build, operating_system.platform, operating_system.platform_like, operating_system.codename, operating_system.arch, system.hardware_vendor, system.hardware_model, osquery.version AS osquery_version FROM system_info AS system CROSS JOIN os_version AS operating_system CROSS JOIN osquery_info AS osquery;",
      "interval": 3600,
      "description": "Return hostname, host UUID, operating system, OS version, architecture, hardware identity, and osquery version."
    },
    "network_ips": {
      "query": "SELECT interface, address, mask, broadcast, point_to_point, type, CASE WHEN instr(address, ':') > 0 THEN 'ipv6' ELSE 'ipv4' END AS address_family, CASE WHEN address = '127.0.0.1' OR address = '::1' THEN 'true' ELSE 'false' END AS is_loopback FROM interface_addresses ORDER BY interface, address;",
      "interval": 3600,
      "description": "Return every IPv4 and IPv6 interface address, including loopback and link-local addresses."
    },
    "deployment_environment": {
      "query": "SELECT CASE WHEN evidence.container_evidence = 1 THEN 'possible_container' WHEN evidence.virtual_machine_evidence = 1 THEN 'possible_virtual_machine' ELSE 'physical_or_unknown' END AS environment_type, CASE WHEN evidence.container_file = 1 THEN 'container marker file' WHEN evidence.overlay_root = 1 THEN 'overlay root filesystem' WHEN evidence.container_cgroup = 1 THEN 'container-related PID 1 cgroup' WHEN evidence.virtual_machine_evidence = 1 THEN 'virtualization-related hardware vendor or model' ELSE 'no container or virtual-machine evidence observed' END AS evidence, evidence.hardware_vendor, evidence.hardware_model, evidence.board_vendor, 'heuristic' AS classification_method FROM (SELECT system.hardware_vendor, system.hardware_model, system.board_vendor, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/.dockerenv' OR path = '/run/.containerenv') THEN 1 ELSE 0 END AS container_file, CASE WHEN EXISTS (SELECT 1 FROM mounts WHERE path = '/' AND type = 'overlay') THEN 1 ELSE 0 END AS overlay_root, CASE WHEN EXISTS (SELECT 1 FROM processes WHERE pid = 1 AND (lower(cgroup_path) LIKE '%docker%' OR lower(cgroup_path) LIKE '%kubepods%' OR lower(cgroup_path) LIKE '%containerd%' OR lower(cgroup_path) LIKE '%lxc%')) THEN 1 ELSE 0 END AS container_cgroup, CASE WHEN EXISTS (SELECT 1 FROM file WHERE path = '/.dockerenv' OR path = '/run/.containerenv') OR EXISTS (SELECT 1 FROM mounts WHERE path = '/' AND type = 'overlay') OR EXISTS (SELECT 1 FROM processes WHERE pid = 1 AND (lower(cgroup_path) LIKE '%docker%' OR lower(cgroup_path) LIKE '%kubepods%' OR lower(cgroup_path) LIKE '%containerd%' OR lower(cgroup_path) LIKE '%lxc%')) THEN 1 ELSE 0 END AS container_evidence, CASE WHEN lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%vmware%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%virtualbox%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%qemu%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%kvm%' OR lower(COALESCE(system.hardware_vendor, '') || ' ' || COALESCE(system.hardware_model, '') || ' ' || COALESCE(system.board_vendor, '')) LIKE '%xen%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%virtual machine%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%amazon ec2%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%google compute engine%' OR lower(COALESCE(system.hardware_model, '')) LIKE '%openstack%' THEN 1 ELSE 0 END AS virtual_machine_evidence FROM system_info AS system) AS evidence;",
      "interval": 3600,
      "description": "Classify the observed environment as a possible container, possible virtual machine, or physical/unknown and return the evidence."
    },
    "execution_identity": {
      "query": "SELECT osquery_instance.pid AS osquery_pid, process.euid AS effective_user_id, user.username, process.egid AS effective_group_id, group_record.groupname AS primary_role, CASE WHEN process.euid = 0 THEN 'root' WHEN EXISTS (SELECT 1 FROM user_groups AS membership JOIN groups AS member_group ON member_group.gid = membership.gid WHERE membership.uid = process.euid AND lower(member_group.groupname) IN ('sudo', 'wheel', 'admin')) THEN 'privileged_group_member' ELSE 'standard_user' END AS privilege_role, 'osquery_effective_identity' AS identity_source, 'true' AS execution_identity_confirmed FROM osquery_info AS osquery_instance JOIN processes AS process ON process.pid = osquery_instance.pid LEFT JOIN users AS user ON user.uid = process.euid LEFT JOIN groups AS group_record ON group_record.gid = process.egid;",
      "interval": 3600,
      "description": "Return the effective user, primary group/role, and privilege category used by the running osquery process."
    },
    "user_roles": {
      "query": "SELECT DISTINCT user.username, group_record.groupname AS role, CASE WHEN group_record.gid = user.gid THEN 'true' ELSE 'false' END AS is_primary_role FROM osquery_info AS osquery_instance JOIN processes AS process ON process.pid = osquery_instance.pid JOIN users AS user ON user.uid = process.euid JOIN user_groups AS membership ON membership.uid = user.uid JOIN groups AS group_record ON group_record.gid = membership.gid ORDER BY user.username, group_record.groupname;",
      "interval": 3600,
      "description": "Return local group roles associated with the effective osquery user."
    }
  }
}

