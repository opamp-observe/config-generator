{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time, app_process.uid, app_process.gid FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 300,
      "description": "Return Node.js application processes with runtime state, ownership, and start time."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.path AS unix_socket_path FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 300,
      "description": "Return TCP, UDP, and Unix sockets owned by Node.js processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS configuration_candidate, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE (lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs') AND (lower(open_file.path) LIKE '%.json' OR lower(open_file.path) LIKE '%.yaml' OR lower(open_file.path) LIKE '%.yml' OR lower(open_file.path) LIKE '%.env' OR lower(open_file.path) LIKE '%.config.js' OR lower(open_file.path) LIKE '%.config.cjs' OR lower(open_file.path) LIKE '%.config.mjs') UNION SELECT app_process.pid, 'working_directory_candidates' AS source, rtrim(app_process.cwd, '/') || '/package.json; ecosystem.config.js; ecosystem.config.cjs; .env; NODE_OPTIONS=' || COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'NODE_OPTIONS' LIMIT 1), '') AS configuration_candidate, 'candidate_review_module_and_process_manager_configuration' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 3600,
      "description": "Return observed and project-relative Node.js, PM2, environment, and NODE_OPTIONS configuration evidence."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS destination, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE (lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs') AND (lower(open_file.path) LIKE '%.log' OR lower(open_file.path) LIKE '%/log/%' OR open_file.path IN ('/dev/stdout', '/dev/stderr')) UNION SELECT app_process.pid, 'environment' AS source, environment.key || '=' || environment.value AS destination, 'observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE (lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs') AND environment.key IN ('NODE_REDIRECT_WARNINGS', 'OTEL_LOGS_EXPORTER', 'PM2_HOME') UNION SELECT app_process.pid, 'command_and_defaults' AS source, app_process.cmdline || ' | stdout; stderr; --redirect-warnings; --diagnostic-dir; --report-directory; PM2_HOME/logs' AS destination, 'candidate_review_application_logger_and_process_manager' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 300,
      "description": "Return observed log files, warnings and diagnostic output settings, stdio, OpenTelemetry logs, and PM2 candidates."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, 'environment' AS source, environment.key AS setting, environment.value AS value, 'observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE (lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs') AND environment.key IN ('OTEL_METRICS_EXPORTER', 'OTEL_EXPORTER_OTLP_ENDPOINT', 'OTEL_EXPORTER_OTLP_METRICS_ENDPOINT', 'OTEL_SERVICE_NAME') UNION SELECT app_process.pid, 'listening_socket' AS source, CASE WHEN lower(app_process.cmdline) LIKE '%--inspect%' THEN 'node_inspector_or_application_endpoint' ELSE 'application_endpoint' END AS setting, listening_socket.address || ':' || CAST(listening_socket.port AS TEXT) AS value, 'candidate_metrics_path_requires_application_configuration_or_probe' AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 300,
      "description": "Return OpenTelemetry exporter settings and application listeners that may expose explicitly configured metrics."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.state AS process_state, app_process.start_time, CASE WHEN app_process.parent IN (0, 1) THEN 'top_level_or_service_managed' ELSE 'child_cluster_worker_or_process_manager_child' END AS process_role, 'running_process' AS state_source FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 300,
      "description": "Report Node.js application state and top-level versus child relationship."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS executable_path, app_process.cwd, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'OTEL_SERVICE_NAME' LIMIT 1), '') AS otel_service_name, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'npm_package_name' LIMIT 1), '') AS npm_package_name, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'NODE_APP_INSTANCE' LIMIT 1), '') AS node_app_instance FROM processes AS app_process CROSS JOIN system_info AS host WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 3600,
      "description": "Return host, process, entry command, OpenTelemetry service, package, and process-manager instance identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.path, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'npm_package_version' LIMIT 1), '') AS npm_package_version, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'NODE_VERSION' LIMIT 1), '') AS node_version_environment, 'runtime_path_and_environment_do_not_guarantee_binary_version' AS limitation FROM processes AS app_process WHERE lower(app_process.name) IN ('node', 'nodejs') OR lower(app_process.path) LIKE '%/node' OR lower(app_process.path) LIKE '%/nodejs';",
      "interval": 3600,
      "description": "Return Node executable and package-version evidence without executing the runtime."
    }
  }
}
