{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time FROM processes AS app_process WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 300,
      "description": "Return Windows Node.js application processes with runtime state and start time."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 300,
      "description": "Return listening sockets owned by Windows Node.js processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, app_process.cmdline, rtrim(app_process.cwd, '\\/') || '/package.json' AS package_config_candidate, rtrim(app_process.cwd, '\\/') || '/ecosystem.config.js' AS pm2_config_candidate, rtrim(app_process.cwd, '\\/') || '/.env' AS environment_config_candidate, 'review_NODE_OPTIONS_module_preloads_and_process_manager_configuration' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 3600,
      "description": "Return project-relative Node.js, PM2, and environment configuration candidates."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, app_process.cmdline AS configuration_evidence, 'stdout; stderr; Windows service host; --redirect-warnings; --diagnostic-dir; --report-directory; PM2_HOME/logs; application logger transports' AS destinations_to_review, 'candidate_not_open_file_observed_on_windows' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 300,
      "description": "Return command evidence and all standard Node.js warning, diagnostic, stdio, service, PM2, and application logger destination classes."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, CASE WHEN lower(app_process.cmdline) LIKE '%--inspect%' THEN 'node_inspector_or_application_endpoint' ELSE 'application_endpoint' END AS mechanism, app_process.cmdline AS configuration_evidence, 'candidate_metrics_path_requires_application_configuration_or_probe; review OpenTelemetry settings' AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 300,
      "description": "Return application and inspector listeners that may expose explicitly configured telemetry."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.state AS process_state, app_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.status, 'not_registered_as_service') AS service_status, COALESCE(service.start_type, '') AS service_start_type FROM processes AS app_process LEFT JOIN services AS service ON service.pid = app_process.pid WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 300,
      "description": "Report Node.js process state and matching Windows service state when registered."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS executable_path, app_process.cwd, app_process.cmdline, COALESCE(service.name, '') AS service_name FROM processes AS app_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = app_process.pid WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 3600,
      "description": "Return host, process, executable, entry command, working-directory, and Windows service identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.path, app_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'installed_program_may_not_match_portable_or_version_manager_runtime' AS limitation FROM processes AS app_process LEFT JOIN programs AS program ON lower(program.name) LIKE 'node.js%' OR lower(program.name) = 'nodejs' WHERE lower(app_process.name) IN ('node.exe', 'nodejs.exe') OR lower(app_process.path) LIKE '%\\node.exe';",
      "interval": 3600,
      "description": "Return Node executable and installed-program version evidence without executing the runtime."
    }
  }
}
