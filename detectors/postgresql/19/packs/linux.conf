{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS postgres_process WHERE postgres_process.name = 'postgres' AND postgres_process.cmdline NOT LIKE 'postgres:%' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%')) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT postgres_process.pid, postgres_process.path AS postgres_binary_path, postgres_process.cmdline, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) AS data_directory FROM processes AS postgres_process WHERE postgres_process.name = 'postgres' AND postgres_process.cmdline NOT LIKE 'postgres:%' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%'));",
      "interval": 3600,
      "description": "Return PostgreSQL postmaster and data-directory evidence."
    },
    "network_ports": {
      "query": "SELECT postgres_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS postgres_process JOIN listening_ports AS listening_socket ON listening_socket.pid = postgres_process.pid WHERE postgres_process.name = 'postgres' AND postgres_process.cmdline NOT LIKE 'postgres:%' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%'));",
      "interval": 3600,
      "description": "Return sockets owned by the PostgreSQL postmaster."
    },
    "configuration_files": {
      "query": "SELECT pid, config_file_candidate, auto_config_file_candidate, hba_file_candidate, ident_file_candidate FROM (SELECT postgres_process.pid, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/postgresql.conf' AS config_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/postgresql.auto.conf' AS auto_config_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/pg_hba.conf' AS hba_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/pg_ident.conf' AS ident_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/log' AS log_directory_candidate, 'stderr may be captured by the container runtime or service manager' AS external_log_note FROM processes AS postgres_process WHERE postgres_process.name = 'postgres' AND postgres_process.cmdline NOT LIKE 'postgres:%' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%'))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product configuration-file locations."
    },
    "log_locations": {
      "query": "SELECT pid, log_directory_candidate, external_log_note FROM (SELECT postgres_process.pid, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/postgresql.conf' AS config_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/postgresql.auto.conf' AS auto_config_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/pg_hba.conf' AS hba_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/pg_ident.conf' AS ident_file_candidate, COALESCE((SELECT data_environment.value FROM process_envs AS data_environment WHERE data_environment.pid = postgres_process.pid AND data_environment.key = 'PGDATA' LIMIT 1), CASE WHEN instr(postgres_process.cmdline, '-D ') > 0 THEN trim(substr(substr(postgres_process.cmdline, instr(postgres_process.cmdline, '-D ') + 3), 1, instr(substr(postgres_process.cmdline || ' ', instr(postgres_process.cmdline, '-D ') + 3), ' ') - 1), '\"') ELSE postgres_process.cwd END) || '/log' AS log_directory_candidate, 'stderr may be captured by the container runtime or service manager' AS external_log_note FROM processes AS postgres_process WHERE postgres_process.name = 'postgres' AND postgres_process.cmdline NOT LIKE 'postgres:%' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%'))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product log-file and log-directory locations."
    },
    "version_evidence": {
      "query": "SELECT postgres_process.pid, major_environment.key AS evidence_key, major_environment.value AS evidence_value, postgres_process.path, postgres_process.cmdline FROM processes AS postgres_process LEFT JOIN process_envs AS major_environment ON major_environment.pid = postgres_process.pid AND major_environment.key IN ('PG_MAJOR', 'PGDATA') WHERE postgres_process.name = 'postgres' AND (postgres_process.path LIKE '%/postgresql/19/%' OR postgres_process.path LIKE '%/19/bin/postgres%' OR postgres_process.cmdline LIKE '%/postgresql/19/%' OR EXISTS (SELECT 1 FROM process_envs AS major_environment WHERE major_environment.pid = postgres_process.pid AND major_environment.key = 'PG_MAJOR' AND major_environment.value LIKE '19%'));",
      "interval": 3600,
      "description": "Return PostgreSQL major-version and data-directory evidence."
    }
  }
}

