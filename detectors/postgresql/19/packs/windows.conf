{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM services AS postgres_service WHERE postgres_service.name LIKE '%postgresql%' AND (postgres_service.name LIKE '%postgresql%19%' OR postgres_service.path LIKE '%PostgreSQL\\19\\%' OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%')) LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT postgres_service.pid, postgres_service.name AS service_name, postgres_service.status, postgres_service.path AS service_command, postgres_process.path AS postgres_binary_path, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END AS data_directory FROM services AS postgres_service LEFT JOIN processes AS postgres_process ON postgres_process.pid = postgres_service.pid WHERE postgres_service.name LIKE '%postgresql%' AND (postgres_service.name LIKE '%postgresql%19%' OR postgres_service.path LIKE '%PostgreSQL\\19\\%' OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%'));",
      "interval": 3600,
      "description": "Return Windows PostgreSQL service and data-directory evidence."
    },
    "network_ports": {
      "query": "SELECT postgres_service.name AS service_name, postgres_service.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM services AS postgres_service JOIN listening_ports AS listening_socket ON listening_socket.pid = postgres_service.pid WHERE postgres_service.name LIKE '%postgresql%' AND (postgres_service.name LIKE '%postgresql%19%' OR postgres_service.path LIKE '%PostgreSQL\\19\\%' OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%'));",
      "interval": 3600,
      "description": "Return sockets owned by the Windows PostgreSQL service."
    },
    "configuration_files": {
      "query": "SELECT pid, config_file_candidate, auto_config_file_candidate, hba_file_candidate, ident_file_candidate FROM (SELECT postgres_service.pid, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\postgresql.conf' AS config_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\postgresql.auto.conf' AS auto_config_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\pg_hba.conf' AS hba_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\pg_ident.conf' AS ident_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\log' AS log_directory_candidate, 'Windows Event Log may be configured instead of file logging' AS external_log_note FROM services AS postgres_service LEFT JOIN processes AS postgres_process ON postgres_process.pid = postgres_service.pid WHERE postgres_service.name LIKE '%postgresql%' AND (postgres_service.name LIKE '%postgresql%19%' OR postgres_service.path LIKE '%PostgreSQL\\19\\%' OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%'))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product configuration-file locations."
    },
    "log_locations": {
      "query": "SELECT pid, log_directory_candidate, external_log_note FROM (SELECT postgres_service.pid, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\postgresql.conf' AS config_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\postgresql.auto.conf' AS auto_config_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\pg_hba.conf' AS hba_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\pg_ident.conf' AS ident_file_candidate, CASE WHEN instr(postgres_service.path, '-D \"') > 0 THEN substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4, instr(substr(postgres_service.path, instr(postgres_service.path, '-D \"') + 4), '\"') - 1) WHEN instr(postgres_service.path, '-D ') > 0 THEN trim(substr(postgres_service.path, instr(postgres_service.path, '-D ') + 3), '\"') ELSE postgres_process.cwd END || '\\log' AS log_directory_candidate, 'Windows Event Log may be configured instead of file logging' AS external_log_note FROM services AS postgres_service LEFT JOIN processes AS postgres_process ON postgres_process.pid = postgres_service.pid WHERE postgres_service.name LIKE '%postgresql%' AND (postgres_service.name LIKE '%postgresql%19%' OR postgres_service.path LIKE '%PostgreSQL\\19\\%' OR EXISTS (SELECT 1 FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%'))) AS discovered_paths;",
      "interval": 3600,
      "description": "Return candidate product log-file and log-directory locations."
    },
    "version_evidence": {
      "query": "SELECT installed_program.name, installed_program.version, installed_program.install_location FROM programs AS installed_program WHERE installed_program.name LIKE '%PostgreSQL%' AND installed_program.version LIKE '19.%';",
      "interval": 3600,
      "description": "Return installed-program evidence for the PostgreSQL major release."
    }
  }
}

