{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS apache_process WHERE lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT apache_process.pid, apache_process.parent, apache_process.path, apache_process.cmdline, apache_process.cwd, apache_process.state, apache_process.start_time, apache_process.uid, apache_process.gid, CASE WHEN apache_process.parent = 1 OR apache_process.parent = 0 THEN 'parent_or_single' ELSE 'worker_or_child' END AS process_role FROM processes AS apache_process WHERE lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2';",
      "interval": 300,
      "description": "Return Apache parent and worker processes with state, ownership, and start time."
    },
    "network_ports": {
      "query": "SELECT apache_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.path AS unix_socket_path FROM processes AS apache_process JOIN listening_ports AS listening_socket ON listening_socket.pid = apache_process.pid WHERE lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2';",
      "interval": 300,
      "description": "Return listening sockets owned by Apache HTTP Server processes."
    },
    "configuration_files": {
      "query": "SELECT apache_process.pid, apache_process.cmdline, CASE WHEN instr(apache_process.cmdline, '-f ') > 0 THEN trim(substr(substr(apache_process.cmdline, instr(apache_process.cmdline, '-f ') + 3), 1, instr(substr(apache_process.cmdline || ' ', instr(apache_process.cmdline, '-f ') + 3), ' ') - 1), '\"') ELSE '' END AS command_config_candidate, CASE WHEN instr(apache_process.cmdline, '-d ') > 0 THEN trim(substr(substr(apache_process.cmdline, instr(apache_process.cmdline, '-d ') + 3), 1, instr(substr(apache_process.cmdline || ' ', instr(apache_process.cmdline, '-d ') + 3), ' ') - 1), '\"') ELSE '' END AS server_root_candidate, '/etc/apache2/apache2.conf; /etc/httpd/conf/httpd.conf; /usr/local/apache2/conf/httpd.conf' AS distribution_config_candidates, 'candidate_not_content_parsed' AS evidence_status FROM processes AS apache_process WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND (apache_process.parent = 1 OR apache_process.parent = 0);",
      "interval": 3600,
      "description": "Return -f/-d configuration evidence and documented or distribution configuration candidates."
    },
    "log_locations": {
      "query": "SELECT apache_process.pid, 'open_file' AS source, open_file.path AS path_or_destination, 'observed_open' AS evidence_status FROM processes AS apache_process JOIN process_open_files AS open_file ON open_file.pid = apache_process.pid WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND (lower(open_file.path) LIKE '%.log' OR lower(open_file.path) LIKE '%/log/%' OR open_file.path IN ('/dev/stdout', '/dev/stderr')) UNION SELECT apache_process.pid, 'documented_candidates' AS source, '/var/log/apache2/access.log; /var/log/apache2/error.log; /var/log/httpd/access_log; /var/log/httpd/error_log; ServerRoot/logs/access_log; ServerRoot/logs/error_log; syslog; piped logger' AS path_or_destination, 'candidate_verify_ErrorLog_CustomLog_TransferLog_and_-E' AS evidence_status FROM processes AS apache_process WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND (apache_process.parent = 1 OR apache_process.parent = 0);",
      "interval": 300,
      "description": "Return observed log descriptors and all documented file, syslog, and piped-log destination classes."
    },
    "metrics_outputs": {
      "query": "SELECT apache_process.pid, listening_socket.address, listening_socket.port, 'http_or_https_unknown' AS scheme, '/server-status?auto' AS endpoint_path_candidate, 'mod_status' AS mechanism, 'candidate_requires_module_and_access_configuration_review_or_probe' AS evidence_status FROM processes AS apache_process JOIN listening_ports AS listening_socket ON listening_socket.pid = apache_process.pid WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND listening_socket.protocol = 6;",
      "interval": 300,
      "description": "Return candidate mod_status machine-readable endpoints without claiming the module or location is enabled."
    },
    "service_state": {
      "query": "SELECT apache_process.pid, apache_process.parent, apache_process.state AS process_state, apache_process.start_time, CASE WHEN apache_process.parent = 1 OR apache_process.parent = 0 THEN 'parent_or_single' ELSE 'worker_or_child' END AS service_role, 'running_process' AS state_source FROM processes AS apache_process WHERE lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2';",
      "interval": 300,
      "description": "Report Apache service state from live parent and worker processes."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, apache_process.pid AS process_id, apache_process.start_time, apache_process.path AS executable_path, apache_process.cmdline, apache_process.uid, apache_process.gid FROM processes AS apache_process CROSS JOIN system_info AS host WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND (apache_process.parent = 1 OR apache_process.parent = 0);",
      "interval": 3600,
      "description": "Return host and parent-process identity fields used to distinguish Apache instances."
    },
    "version_evidence": {
      "query": "SELECT apache_process.pid, apache_process.path, apache_process.cmdline, 'runtime_binary_no_execution' AS evidence_source, 'Run httpd -V or apache2 -V out of band for authoritative version and compiled paths' AS limitation FROM processes AS apache_process WHERE (lower(apache_process.name) IN ('httpd', 'apache2') OR lower(apache_process.path) LIKE '%/httpd' OR lower(apache_process.path) LIKE '%/apache2') AND (apache_process.parent = 1 OR apache_process.parent = 0);",
      "interval": 3600,
      "description": "Return binary evidence while avoiding execution of Apache; exact build metadata requires an out-of-band version command."
    }
  }
}
