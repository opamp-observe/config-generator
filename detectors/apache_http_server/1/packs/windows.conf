{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS apache_process WHERE lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT apache_process.pid, apache_process.parent, apache_process.path, apache_process.cmdline, apache_process.cwd, apache_process.state, apache_process.start_time, CASE WHEN apache_process.parent = 0 THEN 'parent_or_single' ELSE 'parent_or_worker' END AS process_role FROM processes AS apache_process WHERE lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe';",
      "interval": 300,
      "description": "Return Windows Apache parent and worker processes with state and start time."
    },
    "network_ports": {
      "query": "SELECT apache_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS apache_process JOIN listening_ports AS listening_socket ON listening_socket.pid = apache_process.pid WHERE lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe';",
      "interval": 300,
      "description": "Return listening sockets owned by Windows Apache processes."
    },
    "configuration_files": {
      "query": "SELECT apache_process.pid, apache_process.cmdline, CASE WHEN instr(apache_process.cmdline, '-f ') > 0 THEN trim(substr(substr(apache_process.cmdline, instr(apache_process.cmdline, '-f ') + 3), 1, instr(substr(apache_process.cmdline || ' ', instr(apache_process.cmdline, '-f ') + 3), ' ') - 1), '\"') ELSE '' END AS command_config_candidate, CASE WHEN instr(apache_process.cmdline, '-d ') > 0 THEN trim(substr(substr(apache_process.cmdline, instr(apache_process.cmdline, '-d ') + 3), 1, instr(substr(apache_process.cmdline || ' ', instr(apache_process.cmdline, '-d ') + 3), ' ') - 1), '\"') ELSE rtrim(apache_process.cwd, '\\/') END AS server_root_candidate, rtrim(apache_process.cwd, '\\/') || '/conf/httpd.conf' AS default_config_candidate, 'candidate_not_content_parsed' AS evidence_status FROM processes AS apache_process WHERE (lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe') AND apache_process.parent = 0;",
      "interval": 3600,
      "description": "Return -f/-d configuration evidence and the Windows ServerRoot-relative default candidate."
    },
    "log_locations": {
      "query": "SELECT apache_process.pid, rtrim(apache_process.cwd, '\\/') || '/logs/access.log' AS access_log_candidate, rtrim(apache_process.cwd, '\\/') || '/logs/error.log' AS error_log_candidate, 'syslog_or_piped_logger_are_also_configurable' AS alternate_destination, 'candidate_verify_ErrorLog_CustomLog_TransferLog_and_-E' AS evidence_status FROM processes AS apache_process WHERE (lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe') AND apache_process.parent = 0;",
      "interval": 300,
      "description": "Return ServerRoot-relative log candidates and note configurable syslog or piped destinations."
    },
    "metrics_outputs": {
      "query": "SELECT apache_process.pid, listening_socket.address, listening_socket.port, 'http_or_https_unknown' AS scheme, '/server-status?auto' AS endpoint_path_candidate, 'mod_status' AS mechanism, 'candidate_requires_module_and_access_configuration_review_or_probe' AS evidence_status FROM processes AS apache_process JOIN listening_ports AS listening_socket ON listening_socket.pid = apache_process.pid WHERE (lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe') AND listening_socket.protocol = 6;",
      "interval": 300,
      "description": "Return candidate mod_status endpoints without claiming that the module or URL is enabled."
    },
    "service_state": {
      "query": "SELECT apache_process.pid, apache_process.state AS process_state, apache_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.display_name, '') AS service_display_name, COALESCE(service.status, 'not_registered_as_service') AS service_status, COALESCE(service.start_type, '') AS service_start_type FROM processes AS apache_process LEFT JOIN services AS service ON service.pid = apache_process.pid WHERE lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe';",
      "interval": 300,
      "description": "Report Apache process state and matching Windows service state when registered."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, apache_process.pid AS process_id, apache_process.start_time, apache_process.path AS executable_path, apache_process.cmdline, COALESCE(service.name, '') AS service_name FROM processes AS apache_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = apache_process.pid WHERE (lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe') AND apache_process.parent = 0;",
      "interval": 3600,
      "description": "Return host, parent-process, executable, and service identifiers for Windows Apache instances."
    },
    "version_evidence": {
      "query": "SELECT apache_process.pid, apache_process.path, apache_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'installed_program_is_supporting_evidence_only' AS limitation FROM processes AS apache_process LEFT JOIN programs AS program ON lower(program.name) LIKE '%apache%' WHERE (lower(apache_process.name) IN ('httpd.exe', 'apache.exe') OR lower(apache_process.path) LIKE '%\\httpd.exe') AND apache_process.parent = 0;",
      "interval": 3600,
      "description": "Return runtime and installed-program version evidence for Apache HTTP Server."
    }
  }
}
