{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.name, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time FROM processes AS app_process WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 300,
      "description": "Return Windows Java application processes with runtime state, working directory, and launch command."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 300,
      "description": "Return listening sockets owned by Windows Java application processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, app_process.cmdline AS configuration_evidence, rtrim(app_process.cwd, '\\/') || '/application.properties' AS spring_properties_candidate, rtrim(app_process.cwd, '\\/') || '/application.yaml' AS spring_yaml_candidate, 'review_-Djava.util.logging.config.file_-Dlogback.configurationFile_-Dlog4j.configurationFile_-Dotel.javaagent.configuration-file_and_classpath_resources' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 3600,
      "description": "Return command and working-directory candidates for JUL, Logback, Log4j, Spring, and OpenTelemetry agent configuration."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, app_process.cmdline AS configuration_evidence, 'stdout; stderr; Windows service host; -Xlog file=; -XX:ErrorFile; -XX:HeapDumpPath; logging.file.name; logging.file.path; JUL/Logback/Log4j appenders; OTEL logs exporter' AS destinations_to_review, 'candidate_not_open_file_observed_on_windows' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 300,
      "description": "Return command evidence and JVM, Spring, logging-framework, service-host, and OpenTelemetry log destination classes."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, CASE WHEN app_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_registry' WHEN app_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.rmi.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_connector' ELSE 'application_or_actuator_endpoint' END AS mechanism, app_process.cmdline AS configuration_evidence, CASE WHEN lower(app_process.cmdline) LIKE '%spring%' THEN 'candidate_/actuator/prometheus_or_/actuator/metrics_requires_exposure_configuration_or_probe' ELSE 'review_JMX_OpenTelemetry_and_application_metrics_configuration' END AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 300,
      "description": "Return JMX, Spring Actuator, OpenTelemetry, and application listener metrics evidence."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.state AS process_state, app_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.display_name, '') AS service_display_name, COALESCE(service.status, 'not_registered_as_service') AS service_status, COALESCE(service.start_type, '') AS service_start_type FROM processes AS app_process LEFT JOIN services AS service ON service.pid = app_process.pid WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 300,
      "description": "Report Java process state and matching Windows service state when registered."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS java_executable, app_process.cwd, app_process.cmdline, COALESCE(service.name, '') AS service_name FROM processes AS app_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = app_process.pid WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 3600,
      "description": "Return host, JVM process, executable, launch target, working-directory, and Windows service identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.path AS java_executable, app_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'installed_program_may_not_match_portable_or_embedded_runtime' AS limitation FROM processes AS app_process LEFT JOIN programs AS program ON (lower(program.name) LIKE '%jdk%' OR lower(program.name) LIKE '%java development kit%' OR lower(program.name) LIKE '%openjdk%' OR lower(program.name) LIKE '%temurin%' OR lower(program.name) LIKE '%corretto%' OR lower(program.name) LIKE '%zulu%') WHERE lower(app_process.name) IN ('java.exe', 'javaw.exe') OR lower(app_process.path) LIKE '%\\java.exe' OR lower(app_process.path) LIKE '%\\javaw.exe';",
      "interval": 3600,
      "description": "Return JVM path and installed-program version evidence without executing Java."
    }
  }
}
