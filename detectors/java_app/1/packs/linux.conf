{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.path, app_process.cmdline, app_process.cwd, app_process.state, app_process.start_time, app_process.uid, app_process.gid FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 300,
      "description": "Return Java application processes with runtime state, ownership, working directory, and launch command."
    },
    "network_ports": {
      "query": "SELECT app_process.pid, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, listening_socket.path AS unix_socket_path FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 300,
      "description": "Return TCP, UDP, and Unix sockets owned by Java application processes."
    },
    "configuration_files": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS configuration_candidate, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE (lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java') AND (lower(open_file.path) LIKE '%.properties' OR lower(open_file.path) LIKE '%.xml' OR lower(open_file.path) LIKE '%.yaml' OR lower(open_file.path) LIKE '%.yml' OR lower(open_file.path) LIKE '%.conf') UNION SELECT app_process.pid, 'command_and_environment' AS source, app_process.cmdline || ' | JAVA_TOOL_OPTIONS=' || COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'JAVA_TOOL_OPTIONS' LIMIT 1), '') AS configuration_candidate, 'review_-Djava.util.logging.config.file_-Dlogback.configurationFile_-Dlog4j.configurationFile_-Dotel.javaagent.configuration-file_and_application_config' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 3600,
      "description": "Return observed Java configuration files plus JUL, Logback, Log4j, OpenTelemetry agent, and application config evidence."
    },
    "log_locations": {
      "query": "SELECT app_process.pid, 'open_file' AS source, open_file.path AS destination, 'observed_open' AS evidence_status FROM processes AS app_process JOIN process_open_files AS open_file ON open_file.pid = app_process.pid WHERE (lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java') AND (lower(open_file.path) LIKE '%.log' OR lower(open_file.path) LIKE '%.gc' OR lower(open_file.path) LIKE '%.jfr' OR lower(open_file.path) LIKE '%hs_err_pid%' OR open_file.path IN ('/dev/stdout', '/dev/stderr')) UNION SELECT app_process.pid, 'environment' AS source, environment.key || '=' || environment.value AS destination, 'observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE (lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java') AND environment.key IN ('LOG_FILE', 'LOG_PATH', 'OTEL_LOGS_EXPORTER', 'OTEL_JAVAAGENT_LOGGING') UNION SELECT app_process.pid, 'command_line' AS source, app_process.cmdline AS destination, 'review_-Xlog_file_-XX:ErrorFile_-XX:HeapDumpPath_logging.file.name_logging.file.path_and_logging_framework_configuration' AS evidence_status FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 300,
      "description": "Return observed JVM/application logs and configuration evidence for unified logging, crash dumps, heap dumps, Spring, logging frameworks, and OpenTelemetry."
    },
    "metrics_outputs": {
      "query": "SELECT app_process.pid, 'environment' AS source, environment.key AS setting, environment.value AS value, 'observed' AS evidence_status FROM processes AS app_process JOIN process_envs AS environment ON environment.pid = app_process.pid WHERE (lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java') AND environment.key IN ('OTEL_METRICS_EXPORTER', 'OTEL_EXPORTER_OTLP_ENDPOINT', 'OTEL_EXPORTER_OTLP_METRICS_ENDPOINT', 'OTEL_SERVICE_NAME', 'OTEL_JMX_ENABLED', 'OTEL_JMX_TARGET_SYSTEM', 'OTEL_JMX_CONFIG', 'OTEL_JMX_SERVICE_URL') UNION SELECT app_process.pid, 'listening_socket' AS source, CASE WHEN app_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_registry' WHEN app_process.cmdline || ' ' LIKE '%-Dcom.sun.management.jmxremote.rmi.port=' || CAST(listening_socket.port AS TEXT) || ' %' THEN 'jmx_rmi_connector' ELSE 'application_or_actuator_endpoint' END AS setting, listening_socket.address || ':' || CAST(listening_socket.port AS TEXT) AS value, CASE WHEN lower(app_process.cmdline) LIKE '%spring%' THEN 'candidate_/actuator/prometheus_or_/actuator/metrics_requires_exposure_configuration_or_probe' ELSE 'candidate_requires_application_configuration_or_probe' END AS evidence_status FROM processes AS app_process JOIN listening_ports AS listening_socket ON listening_socket.pid = app_process.pid WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 300,
      "description": "Return JMX, OpenTelemetry, Spring Actuator, and application listener metrics evidence with verification status."
    },
    "service_state": {
      "query": "SELECT app_process.pid, app_process.parent, app_process.state AS process_state, app_process.start_time, CASE WHEN app_process.parent IN (0, 1) THEN 'top_level_or_service_managed' ELSE 'child_process' END AS process_role, 'running_process' AS state_source FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 300,
      "description": "Report Java application state and top-level versus child relationship from live processes."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, app_process.pid AS process_id, app_process.start_time, app_process.path AS java_executable, app_process.cwd, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'JAVA_HOME' LIMIT 1), '') AS java_home, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'OTEL_SERVICE_NAME' LIMIT 1), '') AS otel_service_name FROM processes AS app_process CROSS JOIN system_info AS host WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 3600,
      "description": "Return host, JVM process, launch target, Java home, and OpenTelemetry service identifiers."
    },
    "version_evidence": {
      "query": "SELECT app_process.pid, app_process.path AS java_executable, app_process.cmdline, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'JAVA_HOME' LIMIT 1), '') AS java_home, COALESCE((SELECT environment.value FROM process_envs AS environment WHERE environment.pid = app_process.pid AND environment.key = 'JAVA_VERSION' LIMIT 1), '') AS java_version_environment, 'runtime_path_and_environment_do_not_guarantee_jvm_patch_version' AS limitation FROM processes AS app_process WHERE lower(app_process.name) = 'java' OR lower(app_process.path) LIKE '%/java';",
      "interval": 3600,
      "description": "Return JVM path and environment version evidence without executing Java."
    }
  }
}
