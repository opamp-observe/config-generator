{
  "platform": "linux",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.db-wal' OR lower(open_file.path) LIKE '%.db-journal' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite-wal' OR lower(open_file.path) LIKE '%.sqlite-journal' OR lower(open_file.path) LIKE '%.sqlite3' OR lower(open_file.path) LIKE '%.sqlite3-wal' OR lower(open_file.path) LIKE '%.sqlite3-journal' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.parent, owner_process.name, owner_process.path, owner_process.cmdline, owner_process.cwd, owner_process.state, owner_process.start_time, owner_process.uid, owner_process.gid, CASE WHEN lower(owner_process.name) = 'sqlite3' THEN 'sqlite_cli' ELSE 'embedding_application' END AS runtime_role FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.db-wal' OR lower(open_file.path) LIKE '%.db-journal' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite-wal' OR lower(open_file.path) LIKE '%.sqlite-journal' OR lower(open_file.path) LIKE '%.sqlite3' OR lower(open_file.path) LIKE '%.sqlite3-wal' OR lower(open_file.path) LIKE '%.sqlite3-journal';",
      "interval": 300,
      "description": "Return SQLite CLI processes and applications observed with conventional SQLite database or journal files open."
    },
    "network_ports": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, 'owned_by_embedding_process_not_sqlite' AS interpretation FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid JOIN listening_ports AS listening_socket ON listening_socket.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.db-wal' OR lower(open_file.path) LIKE '%.db-journal' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite-wal' OR lower(open_file.path) LIKE '%.sqlite-journal' OR lower(open_file.path) LIKE '%.sqlite3' OR lower(open_file.path) LIKE '%.sqlite3-wal' OR lower(open_file.path) LIKE '%.sqlite3-journal';",
      "interval": 300,
      "description": "Return listeners owned by SQLite embedding applications; SQLite itself has no client/server listener."
    },
    "configuration_files": {
      "query": "SELECT owner_process.pid, open_file.path AS database_or_auxiliary_path, CASE WHEN lower(open_file.path) LIKE '%-wal' THEN 'write_ahead_log' WHEN lower(open_file.path) LIKE '%-shm' THEN 'shared_memory_index' WHEN lower(open_file.path) LIKE '%-journal' THEN 'rollback_journal' ELSE 'main_database_candidate' END AS file_role, 'observed_open' AS evidence_status FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.db-wal' OR lower(open_file.path) LIKE '%.db-shm' OR lower(open_file.path) LIKE '%.db-journal' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite-wal' OR lower(open_file.path) LIKE '%.sqlite-shm' OR lower(open_file.path) LIKE '%.sqlite-journal' OR lower(open_file.path) LIKE '%.sqlite3' OR lower(open_file.path) LIKE '%.sqlite3-wal' OR lower(open_file.path) LIKE '%.sqlite3-shm' OR lower(open_file.path) LIKE '%.sqlite3-journal';",
      "interval": 300,
      "description": "Return observed main databases, rollback journals, WAL files, and shared-memory indexes as SQLite state files."
    },
    "log_locations": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.name AS owning_application, 'embedding_application_logging_or_sqlite3_stdout_stderr' AS destination_owner, 'SQLite has no native server log destination; inspect the owning application configuration' AS limitation FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite3';",
      "interval": 300,
      "description": "State explicitly that SQLite diagnostics belong to the CLI stdio or embedding application's logging system."
    },
    "metrics_outputs": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.name AS owning_application, 'none_native' AS sqlite_metrics_output, 'instrument the embedding application or query SQLite APIs/PRAGMAs in-process' AS collection_guidance FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite3';",
      "interval": 300,
      "description": "Report that SQLite exposes no native metrics endpoint and identify the owning process where instrumentation belongs."
    },
    "service_state": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.parent, owner_process.name AS owning_application, owner_process.state AS process_state, owner_process.start_time, CASE WHEN lower(owner_process.name) = 'sqlite3' THEN 'sqlite_cli' ELSE 'embedding_application' END AS state_owner FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite3';",
      "interval": 300,
      "description": "Report state for the CLI or embedding process because SQLite is an in-process library, not a service."
    },
    "unique_identifiers": {
      "query": "SELECT DISTINCT host.uuid AS host_uuid, owner_process.pid AS owner_process_id, owner_process.start_time, owner_process.path AS owner_executable_path, open_file.path AS database_path, 'host_uuid+database_path identifies a database; pid+start_time identifies an active owner' AS identifier_semantics FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid CROSS JOIN system_info AS host WHERE lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite3';",
      "interval": 3600,
      "description": "Return stable host/database-path identity and active owner process identity for observed SQLite databases."
    },
    "version_evidence": {
      "query": "SELECT DISTINCT owner_process.pid, owner_process.name, owner_process.path, owner_process.cmdline, CASE WHEN lower(owner_process.name) = 'sqlite3' THEN 'cli_binary' ELSE 'embedded_library_version_not_visible' END AS evidence_source, 'An embedding process can statically link SQLite; osquery cannot infer the library version from a database file' AS limitation FROM processes AS owner_process JOIN process_open_files AS open_file ON open_file.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3' OR lower(open_file.path) LIKE '%.db' OR lower(open_file.path) LIKE '%.sqlite' OR lower(open_file.path) LIKE '%.sqlite3';",
      "interval": 3600,
      "description": "Return CLI or embedding-process evidence and explain why database format does not identify the SQLite library version."
    }
  }
}
