{
  "platform": "windows",
  "version": "5.0.0",
  "discovery": [
    "SELECT 1 AS matched FROM processes AS owner_process WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%' LIMIT 1;"
  ],
  "queries": {
    "runtime": {
      "query": "SELECT owner_process.pid, owner_process.parent, owner_process.name, owner_process.path, owner_process.cmdline, owner_process.cwd, owner_process.state, owner_process.start_time, CASE WHEN lower(owner_process.name) = 'sqlite3.exe' THEN 'sqlite_cli' ELSE 'possible_embedding_application_from_command_line' END AS runtime_role FROM processes AS owner_process WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "Return SQLite CLI processes and possible embedding applications whose command lines expose conventional database names."
    },
    "network_ports": {
      "query": "SELECT owner_process.pid, owner_process.name, listening_socket.address, listening_socket.port, listening_socket.protocol, listening_socket.family, 'owned_by_embedding_process_not_sqlite' AS interpretation FROM processes AS owner_process JOIN listening_ports AS listening_socket ON listening_socket.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "Return listeners owned by possible SQLite embedding applications; SQLite itself has no client/server listener."
    },
    "configuration_files": {
      "query": "SELECT owner_process.pid, owner_process.cmdline AS database_path_evidence, 'main database may have any filename; conventional .db/.sqlite/.sqlite3 plus -journal/-wal/-shm auxiliary files' AS file_candidates, 'command_line_only_windows_core_osquery_cannot_enumerate_process_open_files' AS evidence_status FROM processes AS owner_process WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "Return command-line database evidence and documented SQLite main and auxiliary file naming rules."
    },
    "log_locations": {
      "query": "SELECT owner_process.pid, owner_process.name AS owning_application, 'embedding_application_logging_or_sqlite3_stdout_stderr' AS destination_owner, 'SQLite has no native server log destination; inspect the owning application or Windows service configuration' AS limitation FROM processes AS owner_process WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "State explicitly that SQLite diagnostics belong to CLI stdio or the embedding application's logging system."
    },
    "metrics_outputs": {
      "query": "SELECT owner_process.pid, owner_process.name AS owning_application, 'none_native' AS sqlite_metrics_output, 'instrument the embedding application or query SQLite APIs/PRAGMAs in-process' AS collection_guidance FROM processes AS owner_process WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "Report that SQLite exposes no native metrics endpoint and identify possible owning processes."
    },
    "service_state": {
      "query": "SELECT owner_process.pid, owner_process.name AS owning_application, owner_process.state AS process_state, owner_process.start_time, COALESCE(service.name, '') AS service_name, COALESCE(service.status, 'not_registered_as_service') AS service_status FROM processes AS owner_process LEFT JOIN services AS service ON service.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 300,
      "description": "Report state for the CLI or possible embedding process and its Windows service registration."
    },
    "unique_identifiers": {
      "query": "SELECT host.uuid AS host_uuid, owner_process.pid AS owner_process_id, owner_process.start_time, owner_process.path AS owner_executable_path, owner_process.cmdline AS database_path_evidence, COALESCE(service.name, '') AS service_name FROM processes AS owner_process CROSS JOIN system_info AS host LEFT JOIN services AS service ON service.pid = owner_process.pid WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 3600,
      "description": "Return host, process, executable, command-line database, and service identifiers."
    },
    "version_evidence": {
      "query": "SELECT owner_process.pid, owner_process.name, owner_process.path, owner_process.cmdline, COALESCE(program.name, '') AS installed_program, COALESCE(program.version, '') AS installed_version, 'embedded_or_statically_linked_sqlite_version_is_not_visible' AS limitation FROM processes AS owner_process LEFT JOIN programs AS program ON lower(program.name) LIKE 'sqlite%' WHERE lower(owner_process.name) = 'sqlite3.exe' OR lower(owner_process.cmdline) LIKE '%.db%' OR lower(owner_process.cmdline) LIKE '%.sqlite%' OR lower(owner_process.cmdline) LIKE '%.sqlite3%';",
      "interval": 3600,
      "description": "Return CLI installed-program evidence while documenting the embedded-library version limitation."
    }
  }
}
