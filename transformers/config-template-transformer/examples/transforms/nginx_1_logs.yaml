api_version: opamp.info/v1alpha2
kind: ObservabilityFragmentTransform
metadata:
  name: nginx_1_logs
  version: 1.0.0
spec:
  detector:
    name: nginx_1
    version_constraint: ">=1.0,<2.0"
  target:
    tool: fluent-bit
    version_constraint: ">=3.2,<5.0"
  output:
    path: generated/nginx_1.inputs.yaml
    include_path: generated/nginx_1.inputs.yaml
  render:
    engine: jinja2
    template: fluent_bit_inputs.yaml.j2
    metadata_file: fluent_bit_inputs.metadata.yaml
    version: 1.0.0
    template_api_version: "1.0"
    context_name: plugins
  rules:
    - name: observed_log_files
      for_each: $.queries.log_locations[*]
      path_from: $.path_or_destination
      path_match: "(?i)(access|error)[^;]*\\.log$"
      source_format: nginx.auto
      values:
        name: tail
        tag: opamp.nginx
        read_from_head: false
